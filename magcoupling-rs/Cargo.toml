[package]
name = "magcoupling-rs"
version = "0.1.0"
edition = "2024"
description = "Magnetic slip coupling design calculator: Rust port of the magcoupling 1.0.0 workbook engine"
publish = false

[lib]
name = "magcoupling"
path = "src/lib.rs"

[features]
default = []
# The egui panel `gui::MagcouplingPanel`, hostable by any egui app (the
# standalone app, M4, and a window in linkage-sim-rs, M5). egui only: no
# windowing, no eframe, no file dialogs. serde_json, base64 and flate2 write
# and read design files, share links and the results export; log reports the
# sizing outcome (the host chooses the logger: the browser console on the web).
gui = ["dep:egui", "dep:log", "dep:serde_json", "dep:base64", "dep:flate2"]
# The standalone app: `app::MagcouplingApp` and the binaries `magcoupling-app`
# (native) and `magcoupling-web` (wasm32, eframe WebRunner + wasm-bindgen).
# rfd: the native save and open dialogs, and the web file picker.
app = [
    "gui",
    "dep:eframe",
    "dep:log",
    "dep:env_logger",
    "dep:rfd",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
]
# TEST-ONLY. Exposes the switch that turns the approved workbook corrections
# (the deviation registry) off, so parity and differential tests compare
# against the workbook exactly. Enabled only through the self dev-dependency
# below, so `cargo test` and `cargo clippy --all-targets` get it and every
# shipped build does not. Never enable it in the GUI or app.
workbook-parity = []

[dependencies]
# The engine is pure std on purpose: no I/O, no global state, builds for
# wasm32-unknown-unknown with nothing extra. Everything below is optional and
# reached only through the gui and app features.
#
# egui and eframe: the same 0.32 line as linkage-sim-rs, so the panel embeds
# there (M5) with one egui. The caret range unifies with linkage-sim-rs's;
# the exact version (0.32.3, as in linkage-sim-rs/Cargo.lock) is pinned in
# Cargo.lock, and gate.sh checks that both lock files agree.
egui = { version = "0.32", optional = true }
eframe = { version = "0.32", optional = true }
log = { version = "0.4", optional = true }
# Design files, share links and the results export (feature gui). The same
# crates and major versions as linkage-sim-rs's `?m=` share links (deflate,
# then URL-safe base64). float_roundtrip: a design file reads back bit for bit.
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
# File dialogs of the standalone app (feature app), the version linkage-sim-rs
# uses: native save and open, and the web file picker.
rfd = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", optional = true }

# The web entry. wasm-bindgen must equal the wasm-bindgen-cli version that
# deploy-web.yml installs (0.2.114), pinned in Cargo.lock; gate.sh checks it.
# web-sys and js-sys: the canvas, the share link in the page's address
# (Location, UrlSearchParams) and file downloads (Blob, an <a download>).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Url",
    "UrlSearchParams",
    "Window",
] }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
magcoupling-rs = { path = ".", features = ["workbook-parity"] }
# float_roundtrip: parse JSON floats exactly (the default parser can be 1 ULP off).
serde_json = { version = "1", features = ["float_roundtrip"] }

# The standalone app (feature app). magcoupling-app is native only;
# magcoupling-web is the wasm32 entry (on a desktop it opens the same window).
# required-features keeps both out of builds without the app feature, so
# plain cargo test and cargo clippy --all-targets skip them.
[[bin]]
name = "magcoupling-app"
path = "src/bin/magcoupling_app.rs"
required-features = ["app"]

[[bin]]
name = "magcoupling-web"
path = "src/bin/magcoupling_web.rs"
required-features = ["app"]
