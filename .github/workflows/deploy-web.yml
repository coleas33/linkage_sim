name: Deploy Web to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            linkage-sim-rs/target/
            magcoupling-rs/target/
          key: wasm-cargo-${{ hashFiles('linkage-sim-rs/Cargo.lock', 'magcoupling-rs/Cargo.lock') }}
          restore-keys: wasm-cargo-

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.114 --force

      # Both bundles: the linkage app at /tools/linkage/ (web/tools/linkage/)
      # and the magnetic coupling calculator at /tools/magcoupler/
      # (web/tools/magcoupler/). The scripts hold the build arguments
      # (scripts/magcoupling_shipped.sh) and fail the job if cargo built the
      # calculator with the test-only workbook-parity feature.
      - name: Build WASM (both bundles)
        working-directory: linkage-sim-rs
        run: bash scripts/build_web.sh

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        working-directory: linkage-sim-rs/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        working-directory: linkage-sim-rs/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: linkage-sim-rs/web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
