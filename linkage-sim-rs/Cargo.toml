[package]
name = "linkage-sim-rs"
version = "0.1.0"
edition = "2024"
description = "Planar linkage mechanism simulator — Rust port of the validated Python solver"

[features]
default = ["native"]
# native: full desktop build with file dialogs + raster export
native = ["raster", "dep:rfd", "dep:open", "dep:dirs"]
# raster: PNG/GIF export (resvg + gif). Available on both native and
# web — `cargo build --features raster --target wasm32-unknown-unknown`
# enables it on the WASM target. Disabled by default on WASM to keep
# the bundle small (~1MB binary cost).
raster = ["dep:resvg", "dep:gif"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
eframe = "0.32"
egui_plot = "0.33"
log = "0.4"
env_logger = "0.11"
meval = "0.2"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Desktop-only dependencies (behind "native" feature)
rfd = { version = "0.15", optional = true }
resvg = { version = "0.44", optional = true }
gif = { version = "0.13", optional = true }
open = { version = "5", optional = true }
dirs = { version = "5", optional = true }
dxf = "0.6"
uuid = { version = "1", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "Element",
    "Document",
    "Storage",
    "Window",
    "Location",
    "Url",
    "UrlSearchParams",
    "Blob",
    "BlobPropertyBag",
] }
js-sys = "0.3"

[dev-dependencies]
approx = "0.5"
proptest = "1"
meval = "0.2"

[[bin]]
name = "linkage-gui"
path = "src/bin/linkage_gui.rs"
required-features = ["native"]

[[bin]]
name = "linkage-web"
path = "src/bin/linkage_web.rs"
