<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Linkage Simulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e23;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Built by scripts/build_web.sh. The canvas ID must match the string
         passed to eframe::WebRunner::start(). Absolute paths: /tools/linkage (no
         trailing slash) must not resolve the glue against /tools/. -->
    <canvas id="linkage_canvas"></canvas>
    <script type="module">
        import init from '/tools/linkage/linkage-web.js';
        init();
    </script>
</body>
</html>
