active_issues: []

open_questions:
  - |
    Trajectory v3 firmware adapters: JSON is the v1 default (resolved
    2026-04-29 — `gui/export/firmware/json.rs`, see 05-update-tracker). The
    hardware-specific follow-ups (G-code, Aerotech AeroBasic, Beckhoff
    TwinCAT NC PTP, Galil DMC) are each ~150 LoC behind the same
    `FirmwareAdapter` trait — implement on demand once a target controller
    is selected.

  - |
    Trajectory: analytic acceleration inverse. v1 uses finite differences for
    ü (two extra forward solves per sample). Switching to analytic requires
    extending ControlTarget::hessian for non-Angle variants and assembling a
    "kinematic-only γ" with dq/du in place of q̇. Recommended only if FD ü
    accuracy is shown insufficient by hardware-export use cases.
