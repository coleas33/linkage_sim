active_issues: []

open_questions:
  - |
    Should the tool expose a "driver type: linear" option in the GUI so
    actuator-driven mechanisms can use a LinearDriver constraint instead of
    relying on the two-pass statics back-calculation? LinearDriver exists in
    core/linear_driver.rs but has no GUI wiring yet.

known_limitations:
  - Custom 6-Bar sample is overconstrained when body_5/body_6 are merged.
    Documented in the sample JSON; solver uses SVD pseudo-inverse so it
    still works if geometry is compatible.
  - DXF body_rect_to_world forces body-local-frame geometry. Bodies added
    via DXF "Add Geometry to Selected Link" button use the world center
    transformed into local coords; if the target body is rotated at import
    time the geometry rectangle inherits that rotation.
  - Forward dynamics doctests for linear_driver (src/core/linear_driver.rs
    line 7) fail to parse as Rust code. Pre-existing; not blocking.

risks:
  - Non-Grashof sweeps return 361 NaN-padded data points. Any analysis code
    that doesn't tolerate NaN (e.g. envelopes, statistics) must filter it.
    The plot layer filters NaN; CSV/HTML export needs verification.
  - Two-pass statics solve adds an extra SVD per sweep angle. For 361-angle
    sweeps with complex mechanisms this roughly doubles the sweep time.
  - load_from_json_str is destructive (replaces entire mechanism). DXF
    conversion functions were migrated to additive blueprint mutation;
    any new conversion flow must do the same (push_undo + mutate + rebuild).

recent_decisions:
