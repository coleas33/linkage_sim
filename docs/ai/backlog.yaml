  dimension: physics
  risk: physics
  evidence: "CONFIRMED by audit 2026-08-08, 3/3 skeptics (repro: cargo test --test braindump_repro bl010_side_sizing_mode_sweep_panics_debug_assert -- --nocapture, #[should_panic] passes). Tutorial workflow (tutorial.rs:204 'Set Actuator Force to Zero') + compute_sweep on ChebyshevLambdaActuator: panic at src/solver/reactions.rs:666 — pass-2 driver collapse fails (driver_lambda=-195.4 N*m instead of ~0), likely near a dl_dt~0 pose (power-balance guard at reactions.rs:397 only rejects |dl_dt| <= 1e-6). Debug builds abort on a documented user workflow; release builds silently carry the failed validation."
