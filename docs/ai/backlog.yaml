es cold-high at the gearbox input from 0.508 to 0.805 N m, past the 0.6 N m rating); the steel torque quoted is the unsaturated one; only no-back-iron designs get the bench calibration (seed S-10, amended); the wall sentences state the calculator's rule, not physics (trap T-I), the rule rather than the check uses the design flux density (seed S-11, amended), and the magnets-per-ring wall entry was dropped (at the default 12 magnets do not fit, yet one step turned the check OK while the real need stays above the wall); 304 stainless is named as a hub that fires the expansion caution and no listed magnetic steel does (seed S-12, amended); lap-shear strength is glossed. Open should-fix items are recorded there: SF-1 (ruling 5's \"usually\"), SF-2 to SF-6, SF-8 and SF-9. T17 task review fix round 1: the plating note's back-iron entry now names what 304 costs (\"304 needs none but loses steel torque and fires the expansion caution\"; from an unplated steel 304 leaves 51-63 % of the pull-out at the probe designs), pinned by the_plating_note_s_back_iron_entry_names_the_cost_of_each_pick_it_offers; the note-names test also fails on a named pick that does not fire; its text re-review (ruling 7) follows. T17 text re-reviews: 1 restored \"here\" in the 416 and 17-4PH half (\"need no plating here\", which the fix round had dropped; the cost test pins it); 2 passed with no must-fix (304 keeps at most 0.637 of 4140's pull-out over 3707 fitting layouts). SF-1 (ruling 5's \"usually\") stays open."
