  notes: "FIXED 2026-11-27: merged into main (3dfd8b1). The full gate passed on the merged tip 8d40d22 (all 14 gates, none skipped). Three review lenses ran on the build (two on Opus 5.5 while fable was at its usage limit; the widths lens on fable), seven findings (BL097-EP-1 blocking: a number typed into a tiny value's box was dropped; fixed with a red test), then two re-review lenses (two findings, both taken) and a final check of the second fix wave. The browser smoke run from the branch passed (every calculator check true; the gap drag p95 2.7 ms over 185 frames). Left open, a nit from the final check (W2-1): the test an_input_label_that_wraps_is_one_tab_stop_in_either_font still passes with ui.set_row_height removed, a line that matters only when a wrapped row also shows its out-of-range note. BUILT 2026-11-26 on branch magcoupling/columns-hold-still. Root cause: the head line of an input row (the changed dot, the label, the out-of-range note, the reset button) was a ui.horizontal, which does not wrap, so a label longer than its row ran past the column's edge, and egui's side panel grows to what it holds and keeps the width. The evidence's first cause is wrong: the part and grade pickers fit the width they are given under the theme's 8-point button padding (measured at 286, 200 and 150 points, with a library part, a custom one, a grade and none); the row that set 330.1 points is the Key design row 'Thermal conductance to the housing and shafts' (290.1 points of dot and label at the group's 18-point indent, and 6 more for an empty child ui after it), and a filter-run heading is a label in a vertical layout, which wraps. The fix is one rule, input_ui::head_line: the head line of every input row and of every assumption is a line that wraps at the width the row is given, less one point (egui's text layout lets a wrapped row pass its width by up to a point, and a label in a wrapping line takes each row as laid out: 304.28 in 304 for two rows); the note and the reset