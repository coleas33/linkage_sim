- id: BL-050
  title: "Expression drivers: sweeps are time sweeps labelled as angles, and actuator force, power, reactions and gravity totals use the nominal rate"
  dimension: physics
  risk: physics
  evidence: "sweep_time (gui/sweep/mod.rs ~279) assumes theta0 + omega t; for an expression driver AppState fills omega = 2 pi, theta0 = 0 placeholders (blueprint_ops.rs:319-333, file_io.rs:362), so an 'angle' sweep runs t in [0, 1] s labelled 0-360 deg (f = 2 pi t^2: label 90 deg is 22.5 deg). Nominal omega also feeds the reaction solve (sweep/mod.rs:621), actuator force (:703, :712-718; off by omega/f': x4.0 at t = 0.125), actuator power (:725, :729), actuator-basis totals (weights.rs:116), canvas reactions (blueprint_ops.rs:634-635) and the animation export (export/animation.rs:448). ParallelogramActuator with stored force 0 and f = 2 pi t^2 trips the debug_assert at reactions.rs:691 (debug builds panic). Reachable from the GUI (Custom Expression, input_panel.rs:603-768). Found in the 2026-10-06 review of Codex's open-physics report (docs/analyses/2026-10-06-open-physics-review-response.md)."
  acceptance: "for a non-constant driver either (a) the breakdown and actuator outputs are hidden with a visible note, or (b) every rate uses the actual f'(t) (driver row of assemble_phi_t, or thetadot_j - thetadot_i), actuator reactions go through solve_reactions_with_actuator_using_q_dot, and expression sweeps are plotted against time; tests with f = 2 pi t^2 check the labels or time axis, actuator force against tau / (dL/dtheta), and a gravity-only remainder of ~0"
  priority: 2
  status: open
  notes: "Recommended: (a) now, (b) later. Where f' = 0 use a unit-rate velocity solve (q_theta) so forces need no division by the rate. Overlaps BL-036 (the breakdown part) and BL-017 (the debug_assert)."

