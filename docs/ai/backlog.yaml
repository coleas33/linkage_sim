- id: BL-022
  title: "Compound actuator expansion: force anchored at cylinder base and stroke length from mixed body frames"
  dimension: physics
  risk: physics
  evidence: 'Scouting probe 2026-09-28. Any rebuild (incl. add_point_mass) expands a mount-point actuator into cylinder+rod. (a) forces/compound.rs:306 remap_force_to_compound sets point_a=[0,0] (cylinder base) instead of the slide point (half_len,0) at compound.rs:124-126; doc comment at :265 is wrong. actuator_lengths == |L_pin - L0/2| at 360/360 parallelogram samples; plotted F flips sign at 83/361 angles (200 deg: -40/-501 N vs physical +40/+501 N); stored force physically reverses (240 deg: -186.5 vs +86.5). (b) compound.rs:175-176 initial_length/half_len from get_force_point_pos body-local points of two different bodies (io/from_json.rs:25-33, 272-273): Chebyshev lengths span [0.0003,0.1455] m vs stroke limits [0.1245,0.3275] m, phantom end-stop penalty up to ~1245 N at force=0 (evaluation.rs:407-416), sizing F differs by up to 1402 N with sign disagreement at 254/361. Topology switch cause: load_sample keeps the direct mechanism (gui/state/mod.rs:1001) but its blueprint keeps mount names (mod.rs:1024).'
  acceptance: 'regression tests: after a no-op rebuild of ParallelogramActuator and ChebyshevLambdaActuator, actuator_lengths equal the pin-to-pin distance and sizing/stored actuator_forces match the freshly loaded mechanism at every angle (rel 1e-6); Chebyshev end-stop penalty inactive inside stroke limits; tests/braindump_repro.rs BL-017 repro no longer panics in debug'
  priority: 1
  status: fixed
  notes: "Fixed 2026-09-28 on agent/batch-2 (7a1b5ff): remapped force now acts cylinder base -> rod tip (pin to pin), so actuator length is the pin distance regardless of half_len; the mixed-frame initial length only proportions the massless compound bodies (documented at compound.rs expand_compound_force). Tests: tests/compound_actuator_rebuild.rs (rebuild == fresh for stored + sizing on Parallelogram and Chebyshev; end-stop inactive inside limits), compound.rs remap_every_variant_acts_between_base_and_tip. Resolves BL-017 root cause. Prerequisite for the payload-weights feature (Track 2 of docs/superpowers/specs/2026-09-28-payload-weights-gravity-assist-design.md). Likely root cause of BL-017."

