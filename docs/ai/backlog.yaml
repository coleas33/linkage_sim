  dimension: physics
  risk: physics
  evidence: 'solver/inverse_dynamics.rs:67-70 uses only M(q)*q_ddot while M depends on configuration via CG offsets (solver/assembly.rs:133-145); no velocity-quadratic term exists in solver/core/forces. Verified 2026-09-28: parallelogram rocker mass at (0,0.8): tau_ID - tau_statics = -3158.273 N*m at every angle, correct value 0 (constant KE), error = 2*m*s_y*omega^2 exactly. Doc sign at inverse_dynamics.rs:1 opposite to line 70. Forward dynamics (forward_dynamics.rs:100) likely same flaw (unverified).'
  acceptance: 'test: constant-KE case gives tau_ID == tau_statics (rel 1e-9); general case tau_ID - tau_statics == dKE/dtheta per unit rate (energy check) on two samples; forward dynamics checked or split into its own item'
  priority: 2
