  title: "Magcoupler: in the app's own theme and font an opened fold, an opened input group or a filter widens the left column (320 to 330.1 points, up to 443.1), and it stays widened"
  dimension: gui
  risk: mechanical
  evidence: "BL-096 plan review (2026-11-25, UXT-1), probed on the plan's replayed tree in the app's theme and font (theme::apply, fonts::install, the starting design) at 1024 x 700, 1280 x 800 and 1920 x 1080: the left side panel (magcoupling_inputs) is 320 points wide with the folds shut, 330.1 once Detailed inputs opens, 332.1 once Assumptions opens, 368.1 with the filter 'torque' and 425.1 with a filter that lists every input. Each width stays after the fold is shut or the filter cleared, so the centre region and its drawing shift for the rest of the session. A 1280 x 20000 window gives the same widths, so the scroll bar is not the cause. Two things set the width: the Key design magnet part pickers, 296.1 points wide at the group's 18-point indent (gui/pickers.rs, the part and grade ComboBox .width(ui.available_width()) under the theme's 8-point button padding), and labels and filter-run headings that do not wrap ('Opposite-ring field at an aluminium hub (fundamental, free space)' ends at x 418). No text is cut in any of these states. main at f1f1b90 has the same 330.1, 332.1 and 425.1 on its inputs side in the app's font (and 348.1 for the opening tab's indented fold), so BL-096 makes nothing wider and removes the jump on a tab switch; its test the_left_column_is_the_size_column_on_every_tab holds 320 points in egui's default font only. BL-096's whole-branch review (2026-11-26, UXC-2) found a wider state those probes did not open, and the fix wave measured it again on the branch: at 1024 x 700 with the Detailed inputs open and the last workflow group (Calibration and model) opened, by hand or by a fix link or a leaf term on one of its rows (the End-effect coefficient), the column is 443.1 points, set by the label 'Opposite-ring field at an aluminium hub (fundamental, free space)' at the group's 18-point indent. The centre region is then 264.9 points and text is cut on two tabs: Torque vs temperature ('High: plus the production variation allowance' by 42 points,