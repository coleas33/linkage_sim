- id: BL-010
  title: GUI actuator force label disagrees with actuator force plot at same pose
  dimension: gui
  risk: mechanical
  evidence: "CONFIRMED by audit 2026-08-08 (repro: cargo test --test braindump_repro bl010 -- --nocapture). Both widgets read sweep.actuator_forces; divergence is display-only, 3 mechanisms: (1) stored-force mode label prints la.force verbatim (+2225 N, samples/fourbar.rs:671) at force_render.rs:266 while plot Statics shows computed -2222.8 N — sign+quantity mismatch, likely what the user saw; (2) plot-only Tukey outlier filter (plot_panel/mod.rs:648-661) silently drops 7 finite samples the label shows (fence only ~185 N wide on flat curves); (3) label nearest-index lookup (force_render.rs:247-257) breaks on seam-crossing range sweeps via rem_euclid(360) and compares degrees vs METRES for stroke-mode sweeps (never branches on sweep_mode.is_stroke())."
  acceptance: "regression test: canvas-label path returns exactly sweep.actuator_forces[i] at the current driver parameter for (a) full 0..360 sweep, (b) seam-crossing 200..365 range sweep at 365 deg, (c) stroke-mode sweep; plot stops dropping finite samples or label applies the identical filter; promote tests/braindump_repro.rs bl010 tests with assertions inverted"
  priority: 1
  status: fixed
  notes: "Fixed 2026-09-12. Label value now comes from AppState::actuator_label_force (gui/state/mod.rs; ActuatorLabelForce::{Computed,Stored}) which always reads sweep.actuator_forces at SweepData::index_at_driver (gui/sweep/mod.rs: circular nearest-angle in angle mode so seam-crossing range sweeps and wrapped driver angles resolve to the same sample; linear nearest-stroke in metres in stroke mode; NaN samples skipped) — the stored-force gate is gone, so stored-force mode shows the computed statics value too. Plot side: filter_actuator_outliers (Tukey fence drop) removed — both Statics and With-Inertia series are built by plot_panel::finite_series so every finite sample is drawn; near-singular spikes now stretch the auto Y range (Y zoom persists in egui_plot 0.33, so the flat part stays inspectable). default_y_bounds was tried and rejected: in egui_plot 0.33 default_*_bounds re-apply every frame and lock the axis (see BL-019). Tests: tests/actuator_force_label.rs (full sweep, stored-force mode, 200..365 seam sweep incl. 365-deg and wrapped 5-deg scrub, stroke-mode sweep — every index asserted bitwise), sweep::tests::index_at_driver_*, plot_panel::tests::outlier_fence_* (finite_series keeps spikes the old fence dropped; skips only non-finite). Documented (not exposed): label reads Statics only, never actuator_forces_id; with several LinearActuators every label reads the first element's series (pre-existing, unchanged)."

- id: BL-011
  title: Non-360-degree mechanisms flip to mirrored assembly branch / break near range limits
  dimension: physics
  risk: physics
  evidence: "CONFIRMED by audit 2026-08-08, 3/3 skeptics (repro: cargo test --test braindump_repro bl011_sweep_branch_flip_after_unreachable_gap -- --nocapture). Non-Grashof triple-rocker (0.05/0.05/0.05/0.09 m, reachable |theta| <= 86.18 deg): sweep converges 0..86 deg elbow sign -1, fails 87..273, RE-ENTERS at 274 deg on mirrored branch (sign +1) — pose at 360 deg is the mirror of 0 deg. Cause: sweep keeps stale last-good q as Newton guess across the unreachable gap (gui/sweep/mod.rs:667-669) and solve_position is plain NR+SVD with no step limiting or branch-continuity check (solver/kinematics.rs:35-80). Interactive paths share the mechanics (state/mod.rs:1103-1129 solve_at_angle, input_panel.rs:102-105 slider, plot_panel/mod.rs:331-338 plot-click). Shipped 'Flip Branch' workaround button (input_panel.rs:117-126) corroborates."
  acceptance: "promote tests/braindump_repro.rs::bl011_sweep_branch_flip_after_unreachable_gap with inverted assertion: 0..360 sweep of the 0.05/0.05/0.05/0.09 rocker yields elbow sign at 360 deg == sign at 0 deg (no reentry flip); post-gap re-entry preserves branch or is a clean NaN stop; prefer an in-crate #[cfg(test)] test driving compute_sweep_data itself (pattern at sweep/mod.rs:1222+)"
  priority: 1
  status: fixed
  notes: "Fixed for the full 0..360 constant-speed sweep only: gui/sweep/mod.rs solve_sweep_positions — forward pass stops at the first unreachable sample, post-gap samples are reached by a backward pass from 360 deg seeded with the 0-deg solution rotated 2*pi (exact for constant-speed drivers). Tests: sweep::tests::{solve_sweep_positions_full_revolution_preserves_branch (elbow sign at every converged sample), solve_sweep_positions_forward_only_flips_branch_after_gap (pre-fix control), sweep_reentry_after_unreachable_gap_preserves_branch (exact coverage 0..=86/274..=360), sweep_two_arc_fourbar_keeps_both_arcs_when_first_sample_fails}. Verified refinement: proximity to range limit does NOT flip (400-step ping-pong at 0.7-deg steps: zero flips). Remaining paths tracked as BL-018."

