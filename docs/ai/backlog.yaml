ix items applied; four should-fix items stay open there); TC-22 and TC-24 (flux paths, end fringing) drawn. T12 task review fix round 1: the harmonic-set entry no longer bounds the change at 2 % (off the probe designs, with library parts, summing past the fifth moves the pull-out by up to 44 %) and names narrow, widely spaced blocks; the sigma line is taken at pull-out and no longer calls sigma the total of which sigma_1 is a part (sigma_1 exceeds it at 114 of 353 fitting slider designs); the text re-review (ruling 7), its report under the harmonics section, passed the entry and had one must-fix in the sigma line, applied: sigma_1 beside sigma showed the harmonics adding where they lower the pull-out (the 20 mm design; 34 of 289 grid designs), so the line now sets sigma beside the fundamental alone, A_1, which is sigma with the harmonic set at 1; the second text re-review (re-check 2) passed that line with no must-fix (A_1 is the fundamental's peak and sigma the summed curve's maximum at every design the app reaches), and its two optional should-fix items stay open: SF-1 (the square-wave diagram's fundamental is the magnet pattern, a field, not the line's shear stress) and SF-2 (pin the pull-out's sign at the probe designs, since the 2D-torque sign pin follows from the set-1 pin). T12b: the shaft-clamp section paused (ruling 11): engine::clamps::PAUSED hides it on screen and keeps the math, files, links and exports; joint-neutral texts; BL-064 opened, BL-060 paused. T12b text re-review 1: one must-fix, applied: the bore help also names the hub check, which a larger bore can fail before the keyway breaks through (on the 8-magnet probe design from a 15.5 mm bore, keyed or keyless; a keyless joint never breaks through on the input sliders, though the Size tab's lowest Minimum OD can take the wall to zero); its optional SF-1 (the shaft boss help and BL-060 once the section returns) and SF-2 (the cap material help's conductivity) stay open. T12b text re-review 2: the bore help passed with no must-fix; its optional SF-1 corrected the records' keyless floor (0.80 mm on the input sliders, not 0.95 mm; zero at the Size tab's lowest Minimum OD); its notes on the Size tab's keyway break-through line at a keyless zero wall and the Python-locked label \"Keyed bore diameter\" beside a keyless shrink fit (BL-064) stay open for the controller. T13: end_effect and calibration rewritten in the slice-2 structure and physics-reviewed (docs/analyses/2026-10-14-magcoupler-notes-review.md#end_effect, #calibration: PASS in round 3, seven must-fix items applied); the end-effect note now says within 3 % of free-space 3D on the example design (not 1 %), below 3D with fewer magnets or larger rings and optimistic at wide gaps; the magnets-per-ring lever was dropped (3D: more magnets do not cut the real end loss at fixed blocks); the calibration note warns against editing the prototype inputs and gives the bench factor only with no magnetic steel behind the magnets (the 304 design matches). Its open should-fix items are recorded there, among them SF-C (narrower or tightly packed blocks read high against 3D: B822 on the example ring up to 5.2 % high at 12.7 mm and 27 % at 3.2 mm, and it can read high below a third of a pole pitch, where the second watch-out says low) and SF-4 (the end_effect and calibration_factor assumption rationales still say within 2 % and no steel). T13 task review fix round 1: SF-C's W1 applied, scoping the second end-effect watch-out's \"reads low\" to the example design (B822 there reads 3.80 % high at 2.5 mm with 10 per ring and 9.29 % high at 2.0 mm with 12, with the end-effect check OK). Its first text re-review (MUST_FIX, MF-1 applied): the example design has magnetic steel behind both rings, and a 3D check of that circuit reads the model high below a third of a pole pitch (+12.8 % at 2.5 mm, +17.6 % at 2.9 mm), low only near the 2 mm floor (-4.0 %), so the watch-out said f_end can read well high or low below a third of a pole pitch and named no one design. Its second text re-review (MUST_FIX, MF-1 applied): that boundary read as the edge of the hazard, but on the example design as shipped the largest error (+21.5 %, optimistic) lies above it at 3.66 mm, so the watch-out now says that at short overlap f_end is least reliable and can read too high or too low, with no pole-pitch boundary. W0 and the rest of SF-C stay open, with SF-S (the steel circuit's end factor has no 3D check with steel; an ideal-steel estimate puts f_end about 20 % high from 2.9 to 4.25 mm and 6 to 7 % high at 12.7 mm on the example design) and the second re-review's new SF-T (pin the 304 design at the floor as the test's low side). T14 (2026-10-15): new note hot_low_cold_high (the torque band; Start here step 8; the hot-minimum guide and the hot-low, hot-minimum and cold-high rows link it) and br_temperature rewritten (the three alpha records; only a ring with a picked grade keeps its own coefficient); both physics-reviewed (docs/analyses/2026-10-14-magcoupler-notes-review.md#hot_low_cold_high, #br_temperature: PASS in round 3, three must-fix items applied, all in br_temperature: each degree changes torque by a share of about alpha_i + alpha_o, and the grade entry says a grade nearer zero loses a smaller share when hot, not always fewer N m, and that SmCo, the nearest, starts weaker than sintered NdFeB, since from the Y30 design every other grade is nearer zero and starts stronger). Their open should-fix items are recorded there (SF-1, SF-3, SF-4 and SF-6; SF-5's wording went into the README). T14 task review fix round 1: hot_low_cold_high sentence 0 now names both edges of the band (hot-low the weakest coupling expected at the operating temperature, cold-high the strongest at the minimum temperature, allowing for production scatter), and br_temperature's hotter-day entry takes SF-2 (it lowers the temperature margins: the hot-day, magnet-limit and adhesive ones, not the hot-day one alone); the text re-review of both fields (ruling 7) passed with no must-fix, and its three optional should-fix items were applied with no on-screen text change (tests pin sentence 0's trap words, operating temperature, minimum temperature and expected, and the hot-day start as the ambient plus the driving rise; the record says the adhesive's hot fatigue margin, a strength ratio, rises slightly on a hotter day). T15 (2026-10-15): new note when_slipping (\"When the coupling slips\"; Start here step 9 between the torque band and slip heating; it owns the gearbox ripple and the slip frequency, and the ripple row's Why link moved to it from pullout_angle); slip_heating (\"Slip heating: where the heat comes from\") and thermal_time_constant (\"Slip temperature: how hot, and how fast\") rewritten, the latter writing tau_th and the hot-day start as the panel shows them (M43-13 resolved); the heating diagram marks the limit and the time to reach it. All three physics-reviewed (docs/analyses/2026-10-14-magcoupler-notes-review.md#when_slipping, #slip_heating, #thermal_time_constant: PASS in round 2, six must-fix items applied): the re-lock sentence drops the unmodelled \"near zero\" (seed S-8); the ripple is named as the value at the gearbox input, since the output carries the full swing; both stored-field watch-outs say \"those fields\", not the losses or limits, do not follow the design; a shorter fault slip \"can lower\" the peak (seed S-9: once one slip event is hotter than the fault slip it does not); the conductance source drops its typed -2.48 C figure (-2.501 C at today's defaults). Their open should-fix items are recorded there (SF-2, SF-3, SF-4, SF-R2-1 and SF-R2-2); the same stale -2.48 C figure stays in the conductance assumption's source (assumptions.rs) for the task that owns those texts. T15 task review fix round 1: slip_heating sentences 2 and 4 say magnetic steel (a 304 back iron is steel but not magnetic and takes the whole-thickness form), the two aluminium sources name non-magnetic body parts