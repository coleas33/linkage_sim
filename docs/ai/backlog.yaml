ed; it failed at 330.1 points on the first opened fold, at 336.6 on the traced heading, and at 324.1 with the wrap alone taken out) and app::tests::every_input_row_takes_no_more_than_the_width_it_is_given_in_either_font (it fails for many rows with the wrap taken out and for two by 0.28 of a point with the free point taken out). The whole lib suite with the app feature (1129 passed), clippy (native all targets with app; wasm32 gui lib and the web bin) and cargo fmt --check passed on the commit. Left as they were: the pickers cut their choice with an ellipsis where the column is too narrow for it, as on main at 320 points (register row A-45, owner question 68); the wrapping rows Auto adds (size_controls::auto_ui, sizing_ui) kept no free point and none was seen to pass its width (BL-098's commit draws them through the shared gui::wrapping_line, which head_line now calls). Filed 2026-11-25 by the fix wave of the BL-096 plan's review (UXT-1). On main before BL-096. The same kind of jump as BL-098's on the right column, with other causes, so it is its own item. Until it is fixed BL-096's whole-branch review expects 330.1 points, not 320, in the app's font once a fold has opened. Fix wave of the controller's review (2026-11-27): the app test holds Auto on with the Detailed inputs open too (W-4: Auto's line in the Key design group; it fails at 445.2 points with sizing_ui's line made a plain ui.horizontal, which no test caught before), and the two test modules share one side_rect (test_support; W-5). Filed from the review: BL-103 (the width at other pixel ratios, W-3). Fix wave of the re-review (2026-11-27, SK-1): the wrapping head line made each wrapped input label two Tab stops, the second showing no focus (egui 0.32.3 label.rs allocates a label in a wrapping line row by row, and only the first row's id draws the focus underline; Enter there still selected the input). Measured by the re-review in the app's font with the Detailed inputs open: 92 stops round the page where 