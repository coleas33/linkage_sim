  title: Branch flip across unreachable gap still reachable via range-limited sweeps and interactive solve paths
  dimension: physics
  risk: physics
  evidence: "BL-011 fix scope (gui/sweep/mod.rs solve_sweep_positions) is gated on a full 0..360 sweep with a constant-speed driver whose first sample assembles. Still stale-seeded across a gap: range-limited sweeps (e.g. 200..365), full sweeps whose first sample fails, expression drivers, and the interactive paths state/mod.rs solve_at_angle, input_panel.rs slider drag across the gap, plot_panel/mod.rs plot-click on the far side (same 0.05/0.05/0.05/0.09 rocker repro)."
  acceptance: "either a branch-continuity rejection in solve_position callers (reject a converged solution whose elbow/assembly sign differs from the seed's across a failed interval) or fresh-assembly re-seeding on the starting branch for those paths; regression tests for a 200..365 range sweep and for solve_at_angle across the gap on the BL-011 fixture"
  priority: 2
  status: open
  notes: "Split out of BL-011 during review (2026-09-12). The 'Flip Branch' workaround button (input_panel.rs:117-126) remains the user-facing escape hatch until then."

