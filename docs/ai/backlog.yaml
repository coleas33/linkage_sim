- id: BL-100
  title: "Magcoupler: a row of the left column that takes the keyboard's focus is not scrolled into view"
  dimension: gui
  risk: mechanical
  evidence: "BL-096 plan review (2026-11-25, UXT-3), probed on the plan's replayed tree at 1280 x 800 in the app's font: egui 0.32.3 does not scroll a scroll area to a widget that takes the keyboard's focus. With the Detailed inputs fold open, 27 of the 56 Tab stops of the left column land below the window's foot and the column does not follow; with the folds shut all 16 stops are in view. main at f1f1b90 has it on the inputs side of the Geometry tab (18 of 42 stops out of view at 1280 x 800, 21 at 1024 x 700). BL-096 makes the way to the assumptions longer: the Assumptions tab was Tab press 6 on any tab but the first, and in view; in the review's walk (a trace on, so Clear trace is the left column's first stop, press 5) the Assumptions fold's header is press 21 with the folds shut, and press 60 and out of view with Detailed inputs open. Everything is reachable and nothing traps the focus; Space on a focused fold's header opens it and selects nothing."
