ix items applied; four should-fix items stay open there); TC-22 and TC-24 (flux paths, end fringing) drawn. T12 task review fix round 1: the harmonic-set entry no longer bounds the change at 2 % (off the probe designs, with library parts, summing past the fifth moves the pull-out by up to 44 %) and names narrow, widely spaced blocks; the sigma line is taken at pull-out and no longer calls sigma the total of which sigma_1 is a part (sigma_1 exceeds it at 114 of 353 fitting slider designs); the text re-review (ruling 7), its report under the harmonics section, passed the entry and had one must-fix in the sigma line, applied: sigma_1 beside sigma showed the harmonics adding where they lower the pull-out (the 20 mm design; 34 of 289 grid designs), so the line now sets sigma beside the fundamental alone, A_1, which is sigma with the harmonic set at 1; the second text re-review (re-check 2) passed that line with no must-fix (A_1 is the fundamental's peak and sigma the summed curve's maximum at every design the app reaches), and its two optional should-fix items stay open: SF-1 (the square-wave diagram's fundamental is the magnet pattern, a field, not the line's shear stress) and SF-2 (pin the pull-out's sign at the probe designs, since the 2D-torque sign pin follows from the set-1 pin). T12b: the shaft-clamp section paused (ruling 11): engine::clamps::PAUSED hides it on screen and keeps the math, files, links and exports; joint-neutral texts; BL-064 opened, BL-060 paused. T12b text re-review 1: one must-fix, applied: the bore help also names the hub check, which a larger bore can fail before the keyway breaks through (on the 8-magnet probe design from a 15.5 mm bore, keyed or keyless; a keyless joint never breaks through on the input sliders, though the Size tab's lowest Minimum OD can take the wall to zero); its optional SF-1 (the shaft boss help and BL-060 once the section returns) and SF-2 (the cap material help's conductivity) stay open. T12b text re-review 2: the bor