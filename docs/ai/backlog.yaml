  notes: "Split from BL-056 (S2-9). Owner confirmed 2026-10-14: the input limit 0.6 N m is right (3 N m at the 5:1 output, the efficiency left out); the coupling is mounted on the gearbox output. Corrected 2026-10-16 (BL-059 spec section 3, owner decision 1A): the comparison that note called equivalent is not: metal.cold_high_input_Nm (Metal design!C158) divides cold-high by the ratio and the efficiency, so cold-high at the gearbox input <= 0.6 N m means cold-high <= 0.6 × 5 × 0.95 = 2.85 N m at the output (the workbook's model.gearbox_reference_Nm, Calculator!C100), not 3 N m; the two bases disagree for cold-high in (2.85, 3.0] N m (N33AH on both rings, custom dimensions: 2.9401 N m at the output, 0.6190 at the input, fails 1A and would pass 3 N m). Decision 1A: the check compares on the input side, gearbox.cold_high_check = metal.cold_high_input_Nm against coupling.gearbox_input_rating_Nm, which is never unconservative: the forward-drive half of each slip cycle puts T/(i·η) on the input. Open datasheet question (decision 2A: built with 0.6 meanwhile): which GAM datasheet line is the 0.6 N m, an input or an output figure (if it is an output rating divided by the ratio, basis 1A is conservative by the efficiency, 5 %), and a nominal (T2N), acceleration (T2B) or emergency-stop (T2NOT) rating? No on-screen text calls it a peak rating until the owner answers (the Python-locked engine help 'GAM 5:1 peak input rating.' shows only with Show spreadsheet details on); the answer goes here, into the torque-band note's sources and, for a nominal rating, into BL-066. Also open: the old GAM catalog lists -10 or -20 C as the gearbox's lowest operating temperature; the coupling's minimum is -40 C. The ban stays and widens: no note, guide or overlay text says the coupling protects the gearbox (a pass means only that the modelled cold-high peak is within the input rating). Built on magcoupling/bl059-gearbox-check by docs/superpowers/plans/2026-10-16-bl059-gearbox-check.md (T1-T10), spec docs/superpowers/specs/2026-10-16-bl059-gearbox-check-design.md, owner decisions 1A-8A: engine::gearbox (Rust-only, no cell); a counted dashboard check, greyed with the end-effect rows; its guide (a Problem with live numbers and, where no magnet size, gap or count passes both it and the hot minimum, the conflict sentence; Why to the torque-band note; fixes Lower Axial magnet length and Raise Magnet face gap); the example design reads 'Example design: fails 4 of 8 checks' while the shaft-clamp section is paused; Auto unchanged (5A); the hot_low_cold_high and when_slipping watch-outs rewritten and physics re-reviewed (docs/analyses/2026-10-14-magcoupler-notes-review.md, the BL-059 re-review subsections); the guide, verdict, engine and overlay texts G-3 reviewed (docs/analyses/2026-10-14-magcoupler-help-review.md, BL-059 gearbox check). Plan deviations (controller rulings 2026-10-16): Problem sentence 2 shows only with the minimum temperature at or below the operating one, and where the requirement alone is above the rating at the gearbox input (the ratio's or efficiency's slider bottom) it offers no band, since no lever narrows the band below one; an operating temperature below the minimum is BL-067 (both confirmed in the owner's plan review, issues 1A and 2A). Follow-up candidate (owner's plan review, issue 7A): near the gearbox limit the hot-minimum guide holds back its length fix and shows the no-fix line without the reason, which only the gearbox guide gives; the hot-minimum Problem could name the gearbox limit there. AGENTS.md's fbd-math-reviewer pass is linkage-specific (its agent reviews 4-bar FBDs); BL-059's physics passes are the T6 note re-review, the T8 G-3 review and the T10 whole-branch review on the session model, as slice 2's were. Not covered (spec section 3): the repeated slip swing as a fatigue load (BL-066), backlash impacts at each reversal, the ring-down at re-lock, torsional resonance crossings and the drive line's stored energy at a jam. Release (spec section 9) is T10: whole-branch review, GATE PASS with gate 12 running, web build and gui-smoke, then the owner's review of the diff; status stays in_progress until the owner's OK and the push. Release checks done 2026-10-17 (T10): whole-branch review PASS, GATE PASS with gate 12 running, web build and gui-smoke PASS; waiting for the owner's review of the diff. The owner reviewed the diff and gave the OK on 2026-10-17 (AGENTS.md risk: physics), after the whole-branch review's leftovers were folded in at the owner's choice (2A: docs precision, 'slip swing' in the gear ratio's help, the band clause's variation wording, BL-068 filed); merged to main and pushed the same day."
