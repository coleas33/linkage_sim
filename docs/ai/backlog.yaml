  priority: 3
  status: fixed
  notes: "FIXED 2026-11-27: merged into main (3dfd8b1). The full gate passed on the merged tip 8d40d22 (all 14 gates, none skipped). Three review lenses ran on the build (two on Opus 5.5 while fable was at its usage limit; the widths lens on fable), seven findings (BL097-EP-1 blocking: a number typed into a tiny value's box was dropped; fixed with a red test), then two re-review lenses (two findings, both taken) and a final check of the second fix wave. The browser smoke run from the branch passed (every calculator check true; the gap drag p95 2.7 ms over 185 frames). Left open, a nit from the final check (W2-1): the test an_input_label_that_wraps_is_one_tab_stop_in_either_font still passes with ui.set_row_height removed, a line that matters only when a wrapped row also shows its out-of-range note. BUILT 2026-11-26 on branch magcoupling/columns-hold-still. Root cause: a note's diagram is a fixed 300 points wide (diagrams::DIAGRAM_SIZE) and the Explain panel's column holds 284 (its 300 points less two 8-point margins); egui's side panel grows to what it holds and keeps the width, so from the first note with a diagram ('harmonics') the column was 316 points wide. The fix: diagrams::diagram_ui takes the width it is given: 300 x 130 where it has room, else the same picture scaled as one to that width (its shapes are built at full size and scaled with Shape::transform, labels and strokes too, so no label meets another): 284 x 123 in the Explain panel. The sweep the task asked for (every entry the Explain panel can show: the orientation, the note list, 20 notes, 10 checks, 4 tiles, 6 Size rows, every input and every result, 1117 selections, each with the spreadsheet details off and on, on the starting design and on the example design, in the app's font and in egui's default font) found a second cause of the same widening: a label in a wrapping line (ui.horizontal_wrapped) is allocated row by row as egui's text layout placed it, and that layout lets a row pass the wrap width by a fraction of a point. It widened the column by 0.0625 on the notes 'harmonics' and 'a5.uncoated_low_alloy_steel' (their change entries, egui's default font) and by 0.375 on the result temperature.adhesive_life.daily_screen (a wrapping line of its entry, the app's font). The same rule as BL-099's head line fixes it, so it is now one function, gui::wrapping_line (a wrapping line one point narrower than its place), and every wrapping line of the two side columns is drawn through it: input_ui::head_line, size_controls::auto_ui and the panel's sizing_ui on the left; explain.rs's six lines, explorer::change_ui and explains_ui and dashboard::line_ui on the right. With both fixes the sweep is clean in all eight runs (0 of 2 x 1117 in each font on each design), so no backlog item was filed from it. That sweep covered the Explain panel's entries, not the check list's warning rows: the controller's review (2026-11-27, W-1) found a material warning's Why link on a line that did not wrap (dashboard::warnings_ui), which widened the right column for good with no back iron (320.6 points in the app's font, 302.3 in egui's) or a sleeve that conducts better than 316L (337.1 and 318.3), on main as well. The fix wave draws that line through gui::wrapping_line; red test first, the_right_column_keeps_its_width_with_a_material_warning_shown (both designs at 1024 x 700 and in a tall window, where the link also opens its note; it failed at 302.3 and again with the fix taken out). The check entries, the tile entries and the note list keep their layout (their tests pass unchanged; a wrapping line breaks one point sooner). Tests, red first: panel::tests::the_right_column_keeps_its_width_whichever_note_is_shown (1024 x 700 and 1280 x 800, every shown note, then the note list, a check, a tile and the orientation: 300 points and the right edge where it was; it failed at 316.0 on 'harmonics'; with the diagram's scale alone it failed at 300.0625), panel::tests::the_right_column_keeps_its_width_whatever_entry_is_shown_in_the_app_s_own_font (the app feature; it fails at 300.375 with the free point taken out and at 316 with the scale taken out), app::tests::the_right_column_keeps_its_width_with_a_note_shown_in_the_app_s_own_font (Learn, then the note's title; PanelState's width and cut_texts on every tab at both sizes; it fails at 316 with the scale taken out) and diagrams::tests::a_diagram_takes_the_width_it_is_given_scaled_as_one_picture. One existing helper changed with the fix: panel::tests::diagram_points knew a diagram by circles of radius 3.5 and now looks for them at the scaled radius; its tests' assertions are as they were. The whole lib suite with the app feature (1133 passed), clippy (native all targets with app; wasm32 gui lib and the web bin) and cargo fmt --check passed on the commit; the full gate is run on the branch's tip after it, and its verdict is in the hand-over, not here. Not run: the gui-smoke browser run (its lesson link step reads the note's words, which are unchanged). Register row A-46 and owner question 69 hold the one choice: in the Explain panel a diagram is drawn about 5 % smaller than before, labels included. Filed 2026-11-25 by the BL-096 planner (its nothing-lost test reads the right column's edge off each frame because of it). On main before BL-096; not a change of this part. A column that jumps when a note opens is the kind of clunk the overhaul removes (design 1.1), so it belongs with part 2b-iii's look work or its own small fix."
