itch and named no one design. Its second text re-review (MUST_FIX, MF-1 applied): that boundary read as the edge of the hazard, but on the example design as shipped the largest error (+21.5 %, optimistic) lies above it at 3.66 mm, so the watch-out now says that at short overlap f_end is least reliable and can read too high or too low, with no pole-pitch boundary. W0 and the rest of SF-C stay open, with SF-S (the steel circuit's end factor has no 3D check with steel; an ideal-steel estimate puts f_end about 20 % high from 2.9 to 4.25 mm and 6 to 7 % high at 12.7 mm on the example design) and the second re-review's new SF-T (pin the 304 design at the floor as the test's low side). T14 (2026-10-15): new note hot_low_cold_high (the torque band; Start here step 8; the hot-minimum guide and the hot-low, hot-minimum and cold-high rows link it) and br_temperature rewritten (the three alpha records; only a ring with a picked grade keeps its own coefficient); both physics-reviewed (docs/analyses/2026-10-14-magcoupler-notes-review.md#hot_low_cold_high, #br_temperature: PASS in round 3, three must-fix items applied, all in br_temperature: each degree changes torque by a share of about alpha_i + alpha_o, and the grade entry says a grade nearer zero loses a smaller share when hot, not always fewer N m, and that SmCo, the nearest, starts weaker than sintered NdFeB, since from the Y30 design every other grade is nearer zero and starts stronger). Their open should-fix items are recorded there (SF-1, SF-3, SF-4 and SF-6; SF-5's wording went into the README). T14 task review fix round 1: hot_low_cold_high sentence 0 now names both edges of the band (hot-low the weakest coupling expected at the operating temperature, cold-high the strongest at the minimum temperature, allowing for production scatter), and br_temperature's hotter-day entry takes SF-2 (it lowers the temperature margins: the hot-day, magnet-limit and adhesive ones, not the hot-day one alone); the text re-review of both fi