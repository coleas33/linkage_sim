  priority: 3
  status: fixed
  notes: "Split from slice 2 (controller ruling 5, T8 Q2; filed by T20). Until it lands the temperature.slip_loss.sigma_ndfeb_S_m help states today's behaviour. Research 2026-11-09 (docs/analyses/2026-11-09-magcoupling-bl062-conductivity-research.md, untracked in the main checkout on 2026-11-10; two agents, datasheets read from vendor sites, a skeptic section): higher conductivity is more magnet eddy heat in every family, and the engine's 6.7e5 S/m understates the heat of Sm2Co17 grades by a factor of 1.66. Owner ruling 2026-11-10 on open questions (\"Any open questions choose the conservative answer for now and make those assumptions known somewhwre\"): the report's options 1B (sintered NdFeB keeps 6.7e5 S/m, so the default example and Temperature design!C113 do not move), 2C (Sm2Co17 1.54e6 S/m), 3B (SmCo5 2.5e6 S/m), 4B (ferrite 1.0e2 S/m, a bound) and 5B (bonded NdFeB 2.5e4 S/m): outside sintered NdFeB, the highest value printed with a clear unit in each family. The per-family values are Rust-only grade data and do not pass through the input's range check. The other answers: options 1A or 1C move the default example's magnet heat (+15 % or +24 %) and need their own registered deviation; options 2A, 3A, 4A and 5A lower the heat of the other families. For bonded NdFeB the report's skeptic section (S4) disputes the report's own recommendation, 5A, and points to 5B. It was first an assumption, the conservative answer under that ruling; the owner approved it on 2026-11-16 (the end of these notes). Register: docs/analyses/2026-11-10-conservative-assumptions.md, row A-8 (untracked in the main checkout on 2026-11-10). Built 2026-11-11 (branch magcoupling/off-default-fixes) as correction E26, registered as Approval::Owner (item BL-062; first an assumption, approved by the owner on 2026-11-16): each ring's half of the magnets' eddy heat (Temperature design!C129) reads its own ring's conductivity by the family of the ring's grade (GradeFamily::magnet_sigma_S_m in engine/grades.rs, one value per family, each cited in the code with its printed resistivity; the ferrite value is a maker's upper bound, not a measurement), and sintered NdFeB, every library part and a manual magnet with no grade keep the input C113. Both rings are taken as the inner block, as in the workbook, so C129 reads the mean of the two rings' conductivities where it read C113; with E26 off, or with both rings on C113, it is the workbook's value bit for bit. Manual dimensions with the grade on both rings, on the workbook basis: Y30 0.2278 -> 3.401e-5 W, Recoma 26 0.5237 W, Recoma 20 0.8502 W, BCN-19 0.008502 W, and Y30 inside N42 0.1139 W, half of each pair's (the research file's 0.5232 W for Sm2Co17 is 1 / 0.65e-6 unrounded; the code holds this entry's 1.54e6). Two Rust-only results show the value each ring reads (temperature.slip_loss.inner_magnet_sigma_S_m and outer_magnet_sigma_S_m; 1,120 result rows, was 1,118), each with an equation record, and the record of magnets_W reads their mean. Not changed: the stored field C122 and the block size, which still do not follow the grade, so the heat is exact for no grade; a measured drag still replaces the estimate; the Python engine. The default design, every library part and every differential case stay bit for bit, and no blessed, golden, schema or differential data file changed. The overlay help of temperature.slip_loss.sigma_ndfeb_S_m now says which rings read it; the slip_heating note was re-read and no sentence changed; picks::set_by_pick names the input as set where both rings' grades are of another family. Pinned by tests/magnet_conductivity.rs (red first: the Y30 pair read 0.2278 W), E26's five probes and the e26_ tests in tests/deviations.rs, the unit test of the five family answers in engine/grades.rs, the picks tests, the help's claims in gui/plain_text.rs and the drift guard in tests/explain.rs. Mutation checks, each restored after: both rings reading the input again under E26 turned 13 tests red (the red test