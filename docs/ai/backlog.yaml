- id: BL-097
  title: "Magcoupler: Tab through the value box of a slider whose value is off its step rewrites the value as the box shows it: an edit, an undo step and a selection"
  dimension: gui
  risk: mechanical
  evidence: "BL-096 plan prototype (2026-11-25), probed on main at f1f1b90: a panel opened on the spreadsheet's design with metal.face_gap_mm = 1.4123 (a loaded file's value, off the slider's 0.01 step); 17 presses of Tab from the page's top reach and leave the Size column's Magnet face gap value box, after which the gap is 1.41, the undo history holds one step and the gap is selected. gui/input_ui.rs slider() sets update_while_editing(false), so egui's DragValue parses its text and writes it back when the box loses the keyboard's focus, and Slider::set_value rounds to the step's decimals; a value that is not the text its box shows therefore changes although nothing was typed. Every row built on slider() is open to it (the Size column's sliders, the Required torque, the Detailed inputs and Assumptions rows). Decision M41-2 keeps a value off its step until it is edited (idle_frames_change_no_input holds that for idle frames, not for a Tab pass). BL-096 fixes the one case every design met, the Minimum OD's floor, by handing its slider the value its box shows. The plan's review (2026-11-25, UXT-2) found the way there that needs no file, probed on the plan's replayed tree at 1280 x 800: on the app's starting design, Auto on (the magnet length) solves 11.942 mm with hot-low 1.35000 N·m; Auto off adopts that length (decision M41-7), which is off the Overall length slider's step; then Tab from the page's top through the shut Size column: when the focus leaves the Overall length's value box (press 16) the magnet length is 11.9 mm, hot-low is 1.3445 N·m under the 1.35 N·m requirement, the status shows one failed check where it showed none, the undo history holds one more step and the Overall length row is selected. Nothing was typed. The example design does the same (13.770 to 13.8 mm; with the ring radius as Auto's size an inner back apothem of 11.6757 becomes 11.6717 and one more check fails). main at f1f1b90 does it too, on the opening tab and, through the Key design row, on the Geometry tab (11.94 mm, 1.3497 N·m, also failing), so BL-096 adds no exposure. With Auto never used, Tab through the whole page changes nothing on the starting, example and passing designs, the folds shut or the Detailed inputs open."
  acceptance: "A red panel test first: on the app's starting design, Auto on (the magnet length) until it has solved, Auto off, then Tab from the top of the page through the Size column changes no input, makes no undo step, selects nothing and leaves every check as it was; then with a face gap of 1.4123 loaded, Tab from the top of the page past every slider's value box of the Size column and of the open Detailed inputs changes no input, makes no undo step and selects nothing; a typed value followed by Tab or Enter still edits; an arrow key and a drag still edit; the fix is one rule shared by every caller of input_ui::slider (the Size column, the Required torque, input_row), not a patch per row; README and docs/ai updated; GATE PASS."
  priority: 2
  status: fixed
  notes: "FIXED 2026-11-27: merged into main (3dfd8b1). The full gate passed on the merged tip 8d40d22 (all 14 gates, none skipped). Three review lenses ran on the build (two on Opus 5.5 while fable was at its usage limit; the widths lens on fable), seven findings (BL097-EP-1 blocking: a number typed into a tiny value's box was dropped; fixed with a red test), then two re-review lenses (two findings, both taken) and a final check of the second fix wave. The browser smoke run from the branch passed (every calculator check true; the gap drag p95 2.7 ms over 185 frames). Left open, a nit from the final check (W2-1): the test an_input_label_that_wraps_is_one_tab_stop_in_either_font still passes with ui.set_row_height removed, a line that matters only when a wrapped row also shows its out-of-range note. BUILT 2026-11-26 on branch magcoupling/columns-hold-still. Root cause: egui's value box (DragValue) writes its text back when the keyboard's focus leaves it, typed or not, and the text is the value at the box's decimals, clamped to the slider's range. The fix is one rule in gui/input_ui.rs: slider() gives egui's Slider a custom_parser, typed_number, which returns no number for the box's own text (since the fix wave below, the text egui's formatter wrote in the box, recorded through Slider::custom_formatter), so nothing is written back; every caller of slider() has it (the Size column's sliders, the Required torque, input_row's two), and it keeps no state between frames. It also covers a value outside its slider's range, which a Tab pass brought to the range's end (found while writing the red test; not in the evidence above). The special case for the Minimum OD's slider (BL-096, decision D-73) is removed: its tests hold on the one rule and fail with the parser taken out. Behaviour pinned by test and said in the README: the number a box already shows, typed again, is no edit either (register row A-43, owner question 66); a typed value on Tab, Enter or a click elsewhere, an arrow key and a drag edit as before. Tests, red first and red again with the parser taken out: tab_through_a_length_auto_left_off_its_step_changes_nothing (the app's starting design, Auto on until solved, Auto off, Tab: no input, result, Minimum OD, undo step or selection moves; it failed at press 16 with the Overall length selected), tab_past_every_value_box_keeps_a_value_off_its_step_or_outside_its_range (a 1.4123 mm face gap and a requirement past its range, the Size column and the open Detailed inputs), a_typed_value_and_an_arrow_key_edit_a_value_off_its_step_and_its_own_text_does_not, and input_ui's a_value_box_s_own_text_is_no_typed_number. The whole lib suite with the app feature, clippy (native all targets with app; wasm32 gui lib and the web bin) and cargo fmt --check passed on the commit; the full gate was left to the next agent. Filed 2026-11-25 by the BL-096 planner. On main before BL-096, and since BL-093 made the focus no touch it is the only way a Tab pass still selects. Not taken in BL-096: it reaches every input row's edit path (decision M41-2's wording, the typed-value rule of M41-1), more than a layout part should change. Priority raised from 3 to 2 by the fix wave of the plan's review (2026-11-25, UXT-2): three clicks from the first view (Auto on, Auto off, Tab) fail a check with no touch. Fix wave of the controller's review (2026-11-27, BL097-EP-1): the first build took every coarser rounding of the value (format_with_decimals_in_range at each decimal count up to the step's) for the box's own text, and emath's almost_equal holds any two f32 under 16 x f32::EPSILON (about 1.9e-6) equal, so for a tiny value (the vacuum permeability's 1.256637e-6, the NdFeB expansion's -8e-7, the cap's and the web's field integrals) a typed number was thrown away: 1.2566e-6, -1e-6 and 0 changed nothing where main edits, against this item's acceptance. slider() now records the text egui's own formatter writes in the box (Slider::custom_formatter with the default formatter; egui formats before it parses, in the same frame) and typed_number compares the typed number with that text alone. Red test first: a_number_typed_into_a_tiny_value_s_box_edits (the three inputs, one edit and one undo step each, the cap's 0 clamped to its range's 1e-12; it failed on the vacuum permeability, which stayed 1.256637e-6), and a_value_box_s_own_text_is_no_typed_number gains the tiny cases. The box keeps the text of the frame the focus arrived and the parser reads the frame it leaves: the same text, as the value is held and egui's decimal count follows the value and the slider's value per point, save in the very frame an arrow key is pressed (the speed is then the step); the code marks that as a shortcut."
- id: BL-098
  title: "Magcoupler: showing a teaching note widens the right column by 16 points, and it stays widened"
  dimension: gui
  risk: mechanical
  evidence: "BL-096 plan prototype (2026-11-25), probed on main at f1f1b90 at 1280 x 800 and 1024 x 700 with the starting design: the right side panel (magcoupling_dashboard) is 300 points wide until the note 'harmonics' is selected (Learn, or a lesson link); from that frame it is 316.1 points (its left edge moves from 972 to 955.9 at 1280 x 800, from 716 to 699.9 at 1024 x 700), every later note keeps that width, and it stays after the selection returns to the orientation. The centre region, its tiles and its drawing lose those 16 points. Something in that note's entry (explain::note_entry_ui: its diagram, its equation links or a line that does not wrap) is wider than the column, and egui grows a resizable side panel to its content and keeps the width."
