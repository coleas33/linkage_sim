  priority: 3
  status: fixed
  notes: "FIXED 2026-11-27: merged into main (3dfd8b1). The full gate passed on the merged tip 8d40d22 (all 14 gates, none skipped). Three review lenses ran on the build (two on Opus 5.5 while fable was at its usage limit; the widths lens on fable), seven findings (BL097-EP-1 blocking: a number typed into a tiny value's box was dropped; fixed with a red test), then two re-review lenses (two findings, both taken) and a final check of the second fix wave. The browser smoke run from the branch passed (every calculator check true; the gap drag p95 2.7 ms over 185 frames). Left open, a nit from the final check (W2-1): the test an_input_label_that_wraps_is_one_tab_stop_in_either_font still passes with ui.set_row_height removed, a line that matters only when a wrapped row also shows its out-of-range note. BUILT 2026-11-26 on branch magcoupling/columns-hold-still. Root cause: egui scrolls no scroll area to a widget for taking the keyboard's focus. The fix is one rule, gui::follow_focus(ui) in gui/mod.rs, called last in a scroll area's content: in the first frame the area is drawn with the focus on a widget of its own it scrolls by the least that shows the widget whole (scroll_to_rect(rect, None)), and never again, so a wheel or a drag of the scroll bar is not fought; nothing is selected or edited, and an idle frame asks for no repaint. It keeps the focused id it saw last (egui's gained_focus misses an Up or Down arrow key's move, which is followed too) and knows its own widgets by the clip rect that cuts them. Callers: the left column, the Explain panel, the Geometry tab's callout list, the Clamp tab; each has a test that fails with its call taken out, and all fail with the rule's scroll taken out. Tests: the_left_column_follows_the_keyboard_s_focus_and_fights_no_wheel (1280 x 800 and 1024 x 700, the Detailed inputs open: every stop whole after Tab and after Shift+Tab, scrolled no further than it was cut plus egui's gap at the edge; a wheel after it stays; an idle frame asks for no repaint; a Down arrow walk), the_explain_panel_follows_the_keyboard_s_focus, the_centre_s_scrolling_views_follow_the_keyboard_s_focus. The other scroll areas a Tab pass reaches were probed at 1024 x 700: the Equation panel, the Clamp tab's screw-size table and the Results table are not fixed by the one rule and are filed as BL-101; the check list's own scroll area cut no stop and has no call. Found on the way, filed as BL-102: egui's Tab stops that show no focus. The whole lib suite with the app feature, clippy (native all targets with app; wasm32 gui lib and the web bin) and cargo fmt --check passed on the commit; the full gate was left to the next agent. Filed 2026-11-25 by the fix wave of the BL-096 plan's review (UXT-3). On main before BL-096 (its inputs side); not taken in BL-096, a layout part. The Explain panel's and the centre views' scroll areas may need the same rule: check them with the fix. Fix wave of the controller's review (2026-11-27, KF-1): no test held follow_focus's guards against a widget not the area's own. a_wheeled_column_holds_still_while_the_focus_is_on_no_widget_of_its_own wheels the left column 300 points down and passes Tab, then Shift+Tab, across the top bar, the centre and the right column (a check's entry shown) up to the column's first stop: the column does not move. It fails with the clip check taken out (the second stop scrolled the column 24.5 points up, in egui's default font in the smallest window; the re-review's RF-1 corrected 'the first top-bar stop' here and the test's comment, which said 28 points, the first review's reading in the app's font). The side panels and the centre share one egui layer, so the clip check is the guard that matters; the code's comment now says so."
- id: BL-101
  title: "Magcoupler: the Equation panel, the Clamp tab's screw-size table and the Results table do not scroll to the widget that takes the keyboard's focus"
  dimension: gui
  risk: mechanical
  evidence: "BL-100 build (2026-11-26), probed on branch magcoupling/columns-hold-still in the panel tests' harness (egui's default font) at 1024 x 700, Tab and Shift+Tab round the whole page, a focused widget counted as cut when its interact_rect is not its rect. BL-100's rule (gui::follow_focus, called last in a scroll area's content) fixed the left column (33 of 57 stops cut before), the Explain panel (5 of 19 with a check's entry), the Geometry tab's callout list (under the open Equation panel) and the Clamp tab (its last stop, at y 743 to 761 under a view that ends at 684). Not fixed: (1) the Equation panel (gui/explorer.rs). Its formula (magcoupling_equation_formula) and its term list (magcoupling_equation_terms_scroll) are sideways scroll areas inside the panel's up-and-down one (magcoupling_equation_scroll). With the rule called in the outer area, two stops stayed cut after the scroll had settled, each in both directions: on metal.torque_hot_low_Nm a term row's link (x 533.1 to 830.9, shown to x 703), and on metal.hot_min_check the formula (x 344.0 to 837.6, 493.6 points wide, shown to x 703); on temperature.summary.verdict a stop took the focus past the right edge and under the foot (x 670.9 to 828.1, y 713.7 to 727.7, the view ending at x 703 and y 684; where it ended was not recorded). The probe's walk reads a stop's place off the middle of its rect, so it stopped early at these wide stops and its counts for the panel are not whole. Two causes: a widget of the inner area is cut by the inner area's clip rect, so the outer area does not take it for its own; and egui's ScrollArea takes both axes' scroll targets at its end whichever axes it scrolls, so a target set inside the inner area never reaches the outer one. The call was taken out of the Equation panel again. (2) The Clamp tab's screw-size table (clamp_drawing::screw_table_ui, magcoupling_screw_sizes_scroll) is the same nesting, inside a fold that starts shut; not probed open. (3) The Results table (gui/results_table.rs, ScrollArea::both with show_rows) draws only the rows in view, so only they are Tab stops (48 stops in the centre region): the two rows at the view's foot took the focus cut (y 677.8 to 696.1 and 699.1 to 717.5 under a view that ends at 684), and the rows below cannot be reached by keyboard. With the rule, each Tab would draw the next row, and Tab would walk every row of the table before it left it. (4) The check list's own scroll area (magcoupling_checks_scroll) cut no stop at 1024 x 700 on the designs tried and has no call."
  acceptance: "A red panel test first for each: at 1024 x 700, after Tab and after Shift+Tab every focused widget of the Equation panel (open on metal.torque_hot_low_Nm and on metal.hot_min_check) and of the Clamp tab's opened screw-size table is whole in view, up and down and sideways, once the scroll has settled; the Results table does what the owner's answer to question 67 says (the default: as today, and then no focused row is left cut at the view's foot); the check list follows the focus in a window where it scrolls; a wheel after the arrival is not fought; nothing is selected or edited; README and docs/ai updated; GATE PASS."
  priority: 3
  status: open
  notes: "Filed 2026-11-26 by the BL-100 build. On main before BL-100 (no scroll area followed the focus). A way in for the nested areas: follow_focus returns the rect it scrolled to, and the outer area's content scrolls to it again after the inner area has ended. Register row A-44 and owner question 67 hold the Results table's choice. An area added later needs its own call of follow_focus: nothing fails when one is forgotten."
