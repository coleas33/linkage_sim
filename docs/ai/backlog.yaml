- id: BL-055
  title: "Magcoupler gives no cause, remedy or consequence on screen: two unlinked torque targets, an invisible size model, red checks without guidance"
  dimension: gui
  risk: physics
  evidence: "Read-only audit 2026-10-13 (14 agents; 143 of 144 findings survived adversarial verification; themes T1, T2, T3 and part of T5) after the owner went from 10 to 8 magnets, lowered the torque target and the coupling did not shrink. At the default ring, 10 -> 8 magnets takes pull-out from 2.69 to 1.97 N m (-27 %), grows the cup OD from 41.3 to 42.4 mm and leaves the outside diameter at 42.8 mm (the cap sets it); the Torque -> Magnets target was separate GUI state (gui/sizing.rs:85-105), so a lower target showed a green 'Solved' beside a red 'Below hot minimum'; the default design opens with three Fails whose one remedy cites 'Metal design C122' (engine/materials.rs:244); 15 of 17 dashboard rows read 'No teaching note'. Owner decisions G-1 to G-8 (docs/superpowers/specs/2026-10-13-magcoupler-guidance-design.md)."
  acceptance: "One torque number: the sizing target is metal.required_min_Nm (the Required slider edits it, one undo restores it, files and links round-trip, a file whose target differs uses the requirement with a notice); the panel opens on Size and torque with a dismissible welcome strip; the Size tab shows Required, Hot-low with its live gap and Pull-out torque (nominal, at T), and under the controls what moves what (neighbour magnet counts from compute_all, the smallest fitting diameter, the cap, cup and boss that set the outside diameter, the magnets plus housing lengths); the solver is an Auto toggle on the Size tab (matching slider locked, re-solve after the debounce, ring size searching the Minimum OD range, opening the tab no longer forces forward mode); the dashboard has a design status line, a Magnets fit row, Problem, Why and Fix under red and amber rows and a Why: link on every row; no guidance text matches the banned patterns and every number comes from results; idle frames edit no input; engine verdict strings unchanged (tests/python_schema.rs); fresh-context physics review of every new physics sentence (G-3), whole-branch review and full GATE PASS"
  priority: 2
  status: fixed
  notes: "GUI-side layer plus engine helpers (engine::size_controls breakdowns, smallest_fitting_diameter, ring_radius_range and with_ring_radius; sizing::solve_in); torque model, deviations, input metadata, DESIGN_VERSION and the file schema unchanged. Reverses A2-9 and M41-9 (the target only) and M42-2. Spec deviations accepted by the controller: D-1 (a neighbour magnet count that fails only the keyway clause of is_valid still shows its torque, since the keyway does not depend on the magnet count and the Size tab and dashboard already flag it; a neighbour reads in words only when its blocks do not fit, its end effect is out of range or its torque is not finite); D-2 (the target-mismatch notice carries units: This file's sizing target (X N·m) differed from its requirement (Y N·m); the requirement is used); D-3 (a requirement of zero or less is left out of a saved file, which keeps round trips exact; load accepts a file without it). RING_SIZE_STAYS reads: The ring radius stays the same when you change the magnet count; the cup OD below can still change. It is the first line under Magnets per ring with Auto off; with Auto on the ring size or the magnet length the line is AUTO_RESIZES_RING or AUTO_RESETS_LENGTH (physics review 3, N4). The target-mismatch notice shows only for a Torque -> Magnets file or link: forward-mode files written before G-2 carry the default target 2.5, which that mode never used (final review). Known limitations: a fix can name an input Auto holds, and its link then frames a locked row; the consequence lines recompute on every drag frame (about 30 compute_all calls), accepted and recorded in 02-system; the Required slider's value box is registered with the edit check, so typing in it holds the solve (no debounce gap). Out of scope, later slices: note rewrites and three new notes, 87 empty help strings, on-screen jargon (four names for one radius), the torque sensitivity card, guided lessons, plot captions, drawing titles, guides for results-table checks off the dashboard. Release (G-8): merge to main and push after the physics review, the whole-branch review and GATE PASS."

