what_it_is: |
  Planar multibody linkage simulator for engineering analysis.
  Given a mechanism defined as rigid bodies connected by joints, it computes
  kinematics (positions/velocities/accelerations), static force balance
  (joint reactions, required input effort), inverse dynamics (with inertia),
  and forward dynamics (time-domain simulation). Ships a Rust + egui GUI
  (native + WASM) with 30 sample mechanisms, 15 plot tabs, DXF import,
  sweep + parametric analysis, and HTML/CSV/SVG/GIF/DXF export.

architecture_invariants:
  - body-constraint incidence model (bodies are first-class; joints are
    constraints between them; no special-case code per mechanism type)
  - constraint-first mathematics: Phi(q,t)=0, Phi_q Jacobian, Lagrange
    multipliers. Every analysis mode layers on this one backbone.
  - SI internally (m, kg, s, N, N*m), engineering units at the GUI boundary
  - force elements are pluggable; each returns a Q contribution. Solvers
    never change when adding smooth elements.
  - drivers are constraints (add rows to Phi), not force elements

major_subsystems:
  core:
    path: linkage-sim-rs/src/core/
    responsibility: Body, constraint (revolute/prismatic/fixed/cam/driver),
      mechanism assembly, state vector management
    key_files: [body.rs, constraint/mod.rs, mechanism.rs, state.rs, driver.rs, linear_driver.rs]

  forces:
    path: linkage-sim-rs/src/forces/
    responsibility: 12 force element types (gravity, springs, dampers,
      gas spring, bearing friction, joint limit, motor, linear actuator,
      external force/torque, force zone) + evaluation to generalized Q
    key_files: [elements/element_types.rs, elements/evaluation.rs, helpers.rs]

  solver:
    path: linkage-sim-rs/src/solver/
    responsibility: kinematics (position NR, velocity, acceleration),
      statics (Phi_q^T lambda = -Q), inverse dynamics, forward dynamics
      (RK4 + Baumgarte stabilization), assembly (Jacobian, mass matrix)
    key_files: [kinematics.rs, statics.rs, inverse_dynamics.rs, forward_dynamics.rs, assembly.rs, condition.rs]

  analysis:
    path: linkage-sim-rs/src/analysis/
    responsibility: validation (Grubler, Jacobian rank), Grashof,
      transmission angle, coupler trace, energy, envelopes, motor sizing,
      virtual work, crank selection, force breakdown, per-weight gravity
      breakdown (gravity_breakdown.rs)
    key_files: [validation.rs, grashof.rs, transmission.rs, coupler.rs, energy.rs, virtual_work.rs]

  io:
    path: linkage-sim-rs/src/io/
    responsibility: JSON serialization (serde), schema versioning,
      mechanism blueprint round-trip
    key_files: [schema.rs, serialization.rs, to_json.rs]

  gui:
    path: linkage-sim-rs/src/gui/
    responsibility: all user-facing interaction. Split into multiple
      sub-modules (see 03-structure.yaml)

  magcoupling:
    path: magcoupling-rs/
    responsibility: magnetic slip coupling calculator, Rust port of the
      vendored Python oracle reference/magcoupling-py (workbook port).
      Workbook-exact except registered, approved corrections (deviation
      registry, M1 audit E1-E14, Addendum A E15-E20). Engine complete (M2), every module but fields3d;
      Addendum A-1 adds the grade table, materials per part with physics links, and six warnings;
      Addendum A-2 adds the harmonic set, the assumptions registry, inverse sizing and the space claim, with an axial housing that follows the length override.
      M4 infrastructure adds the egui panel (feature gui), the standalone app and its native and
      web binaries (feature app), and the second web bundle at /magcoupling/.
      Addendum A-3 adds the equation explorer's engine side (evaluable equation records proven by a drift guard, the dependency graph, the A3 traceability test and the A4 teaching notes).
      M4-1 grows the panel with every input from the metadata, the dashboard, the results table,
      undo/redo, design files and share links, the sizing mode and the linkage app's theme.
      M4-2 adds the centre region's views, the geometry view to scale (the default), five plots
      (egui_plot) and the clamp drawing and table.
      M4-3 adds the equation explorer (typesetter, hover on every value, the docked Equation panel),
      the assumptions view and banner, the teaching notes with their diagrams, the material, part
      and grade pickers and the material warnings.
      M5 embeds the panel in the linkage app (linkage-sim-rs depends on the crate with feature gui
      and shows the panel in its Tools -> Magnetic coupling window, gui::calculator_window).
    key_files: [src/engine/meta.rs, src/engine/compat.rs, src/engine/deviations.rs, src/engine/api.rs, src/gui/panel.rs, src/gui/session.rs, src/gui/sizing.rs, src/gui/dashboard.rs, src/gui/geometry.rs, src/gui/geometry_view.rs, src/gui/plots.rs, src/gui/clamp_drawing.rs, src/gui/typeset.rs, src/gui/readouts.rs, src/gui/explorer.rs, src/gui/pickers.rs, src/app.rs]
    invariants:
      - With Deviations::NONE every celled result, table cell and default input equals the workbook snapshot (1,149 checks; 1e-9 relative, 1e-12 absolute, text exact).
      - Every departure from the workbook is an approved, registered deviation (E1-E20 in deviations.rs; E15-E17 are probed on top of E9, decision 15). compute_all always applies Deviations::ALL; the switch exists only behind the test-only workbook-parity feature.
      - Differential data comes from the unchanged Python oracle; slider ranges are defined once in Rust (input_schema.json) and read by gen_differential.py; gate 12 fails on stale data.
      - A correction that changes more than 15 cells at defaults is a reviewed golden file (tests/data/deviations); one that changes none carries a registry probe.
      - The engine never panics on inputs; out-of-choice selector codes give NaN or "#N/A"; DesignInputs::validate() at input boundaries; no i64 arithmetic on input-derived values.
      - Rust-only inputs and results (rust_only metadata) have no cell and are skipped by the parity, metadata and differential tests; gen_differential.py never passes a Rust-only input to Python.
      - "Every Rust-only selector's default reproduces the ported behaviour bit for bit: part materials at code 1 are the workbook inputs, a blank grade is the manual mode, coercivity_source 1 with the N42SH grade gives the workbook's 1592 kA/m and -0.005 /C, max_harmonic 5 sums 1, 3, 5 in the workbook's order, a blank axial_length_mm keeps each ring's length and the housing inputs as typed."
      - "With the axial length override set, the hub length, cup cavity depth and retainer span in effect follow the rings they bound (housing::axial_housing, decision A2-8), each input plus its ring's length change from the ring's own length (for the retainer span, the longer ring's), and never shorter than that ring; every result that reads them (masses, heat capacity, both axial stacks, the space claim) reads the values in effect, which housing.* reports."
      - "The E7 peak search (model::peak_off_half_pitch) returns None exactly when half a pitch is the maximum (1e-12 relative), so every E7-neutral design keeps the workbook expression bit for bit; it finds every root of dT/dx in cos^2 x by recursion on derivatives (no closed form, no scan grid)."
      - "Inverse sizing (sizing::solve) evaluates compute_all only inside the free variable's slider range; a continuous variable's 64-cell scan is refined between samples at the first crossing, at each peak (golden section) and at each validity edge, so only a torque hump whose rise and fall both lie inside one cell is unseen (the documented limit). A value counts only if sizing::is_valid holds (the blocks fit, faceted blocks on their flats and arcs without overlapping, model::blocks_fit; the keyway leaves hub wall; f_end > 0, model::end_effect_in_range; a finite hot-low torque) and meets when its hot-low torque reaches the target; poles stay even."
      - "Library parts and gradeless manual magnets use Calibration C22 and the NdFeB density; only a grade-mode ring (manual dimensions with a grade) takes its grade's alpha(Br) and density (decision A2-7)."
      - "The engine stays pure std: egui, egui_plot and eframe are optional dependencies behind the gui and app features, and the no-feature wasm32 check (gate 6) proves it. egui, egui_plot, eframe and wasm-bindgen are locked at linkage-sim-rs's versions, and wasm-bindgen at deploy-web.yml's wasm-bindgen-cli pin (gate 11)."
      - "workbook-parity never reaches a shipped build, the linkage app's included (its native and web builds carry the panel). The shipped cargo arguments live once, in linkage-sim-rs/scripts/magcoupling_shipped.sh (MAGCOUPLING_* and LINKAGE_*). build_web.sh, build_magcoupling_web.sh and gate 10 read cargo's --message-format=json record of the compiled units, and they fail if a magcoupling-rs unit has the feature; deploy-web.yml builds through build_web.sh. Gate 10 also runs a negative control per shipped build that must trip."
      - "Every equation record (src/engine/explain/records/) reproduces the engine's result by the parity rule at the defaults and at every differential case under every augmentation, corrections on, every value term of every record taking two values there (the drift guard, tests/explain.rs); the registry refuses a formula that reads a path in two units or would typeset two ways; the formula shown is the one evaluated (no custom evals); a record reads its terms' engine values and never recomputes upstream; a value the engine computed but did not expose becomes a Rust-only result (a read); every path of the explorer's scope (169) drills down to inputs."
      - "A3 traceability: nudging any input moves no explained result outside its dependency set (soundness; every input but the two no result reads changes some result at some design point), and each assumption moves every numeric result on its active path at some design point above rounding, with the algebraic cancellations listed with reasons (sensitivity)."
      - "The panel (gui::MagcouplingPanel) computes only through compute_all, with every correction on. It recomputes every frame after the inputs are drawn, so the readout shows the same frame's edits. Its sliders come from the input metadata and clamp edits only, so an idle frame never rewrites an input; slider values are rounded to the step's decimals (decision M41-1)."
      - "Every edit goes through InputSet::set (rows, design files, share links); loading a file or a link is all or nothing and the refusal names every problem of the inputs and the sizing state (gui::session, decision M41-6). Files and links are one schema-versioned JSON format naming every input and the sizing state; a renamed or removed input path gets a session::PATH_MIGRATIONS entry and a DESIGN_VERSION bump, so older files and links keep opening."
      - "An edit is in progress while a pointer button is down, a key is held down (a held arrow key's auto-repeat run is one undo step) or a text field of an input row (or the target's value box) has focus; a focused text field elsewhere (the results search) is no edit. Undo steps and solves wait for it to end. A share link opened at start-up is the session's start (open_share_payload: no undo step)."
      - "sizing::solve never runs per frame: gui::sizing::SizingRunner solves once the design has been still for DEBOUNCE_S (0.25 s) and no edit is in progress. In Torque -> Magnets the panel shows the inputs with the free variable at the solved (or best) value; the inputs keep their own value until the mode is left, when a change still waiting for its debounce is solved at once (solve_now, one solve per click)."
      - "The panel does no I/O: saving and picking files are PanelRequests its host does (the standalone app: app::files; the linkage app: gui::calculator_window, export::download to save and rfd to pick, natively and on the web). A SaveFile carries the file's bytes: the design file and the CSV and JSON exports as UTF-8 text, the spreadsheet as an .xlsx file."
      - "The spreadsheet export (gui::spreadsheet lays it out, gui::xlsx writes it) holds values only, never a formula, and nothing reads it back into the site (decision X-1). Every input and every result is on exactly one row (the Key design inputs are flagged, not repeated), the inputs in the order the inputs side shows and the results in the results table's grouped order, both laid out by the page's own code (InputGroup::plain_sections and advanced_sections, InputSection::heading_in; results_table::table_lines, entry_level and worst_level), never a copy of its rules; a number that is not finite is the CSV's text; a check's level is check_level's, so a check greyed by the end effect has none."
      - "The corrected-vs-workbook markers come from the deviation registry (cells, changes at defaults, probes) and the compiled golden files (E3, E4, E5), never from computing with corrections off (gui::corrections)."
      - "The geometry view draws the design shown from its results only (gui::geometry): every dimension is a result, the axial ones the housing in effect (housing.*), so the drawing follows every edit, the length override and Torque -> Magnets; a piece holding a number that is not finite is not drawn, and blocks are drawn only for 2 to 200 poles (the pocket and the hub round below 3 poles: a 2-gon has no corners)."
      - "Every displayed value goes through gui::readouts::Readouts::show (the dashboard, the results table, the geometry callouts, the clamp tab, the plot readouts): its hover text and equation are built only while it is hovered, a click opens it in the Equation panel, and a value whose path is a term of the equation in view (hovered last frame, else open) is framed in that term's colour. The equation registry is built once per process (readouts::registry, a OnceLock), never per frame; a frame only looks paths up."
      - "The typesetter draws only what the record says (a test checks every text run against render::plain; a selector compared for equality, = or ≠, with a code shows its choice's label, an ordering keeps its numbers) and only the parentheses the markup writes and only characters egui's default fonts have: gui::typeset::glyph_safe draws the missing ϑ, superscript minus and ∝ as θ, ¯ and ~ (display only; no record or note text changes), ∈ and the ceiling and floor brackets are strokes; a test lays out every equation and checks every character, another every teaching note."
      - "The plot tabs build their series from the same frame's results through the engine's own closed forms (model::ring_pair_factor for torque against temperature, the amp*_Pa amplitudes for torque against rotation), which tests pin to the engine's torques; only the tab shown builds its series, and a point that is not finite is left out."

dataflow_on_user_change: |
  user edit -> state.blueprint mutation -> state.push_undo() -> state.rebuild()
    -> Mechanism::build() -> solve_position() -> state.q updated
    -> compute_sweep() (debounced) -> sweep_data updated -> plots/canvas redraw

two_pass_statics_for_actuators: |
  For mechanisms with a LinearActuator force element, statics is solved twice:
  1) With actuator force=0, read back driver_torque T.
  2) Compute F_actuator = T*omega/dL_dt via power balance.
  3) Re-solve statics with F_actuator injected into Q. Joint reactions now
     reflect the actuator as the prime mover (driver torque drops to ~0).

invariants_to_protect:
  - All DXF-created bodies use local=world frame (attachment points in
    world coords, body pose 0,0,0) so they render correctly without needing
    joint constraints to fix position. If you change this, you must update
    the conversion functions AND the force-zone geometry offset computation.
  - Within one sweep, ALL data channels (angles_deg, body_angles,
    coupler_traces, reactions, etc.) must share the same length. Solver
    failures push NaN rows via push_nan_row() so the alignment survives.
    The length itself is 361 only for full-range sweeps (0..=360); a
    custom range sweeps literally min..=max in 1° steps, so length is
    max-min+1. Plot consumers key off angles_deg, not a fixed count.
    SweepData::weight_breakdown (per-weight gravity breakdown) obeys the
    same rule: every per-source and total series has angles_deg.len()
    entries; push_nan_row (and the velocity-failure branch) push a NaN row
    into its WeightBreakdownBuilder.
  - weight_breakdown_total_is_required_force — gui/sweep/weights.rs
    required_totals: for an actuator, total_force = the sweep's
    actuator_forces as is. Since BL-026 that is already the required force
    in sizing and stored-force mode alike
    (solver::reactions::required_actuator_force), so never add the stored
    force again (stored_force_mode_and_sizing_mode_give_identical_breakdowns
    fails if you do). total_power = driver_torque*omega + stored*dL/dt,
    the same balance times dL/dt, finite through stroke reversal where
    actuator_forces is NaN. Without an actuator the shares are
    driver-effort shares (N*m, or N for a linear driver) with rate =
    driver rate. Force shares are NaN where |dL/dt| < 1 % of its sweep max;
    power shares and classification stay defined. A failed statics solve
    gives NaN totals, not the 0 torque the plot shows.
  - Every state mutation that changes the blueprint MUST call push_undo()
    BEFORE the mutation and rebuild() AFTER. Skipping push_undo loses undo
    history; skipping rebuild leaves mechanism out of sync with blueprint.
    Use AppState::mutate_and_rebuild(|s| ...) when possible.
  - point_mass_ops_one_undo_step_per_commit — the id-addressed weight API
    (AppState::add_point_mass -> Option<id>, move_point_mass (same body =
    reposition, other body = reattach keeping id/label/mass),
    set_point_mass_mass, set_point_mass_label, remove_point_mass_by_id;
    find_point_mass to read) validates first and pushes exactly one undo
    entry via mutate_and_rebuild. Invalid target (missing weight/body, ground
    target, mass not positive+finite, non-finite position) = false/None, no
    entry, no rebuild; a no-op edit = true, no entry. Call once per committed
    edit (drag-stop / typed value / click), never per drag frame. Move to
    Link is one move_point_mass, not remove + add (BL-025).
  - blueprint_mass_is_base_live_mass_is_composite — state.blueprint bodies
    hold BASE mass/CG/Izz plus a point_masses list; the built Mechanism
    holds the composite (base + point masses). Anything that writes a
    file/URL from the live mechanism (AppState::serialize_to_json_string)
    must write the blueprint BASE values for bodies that have point_masses,
    because load re-applies the list on top. Writing composite + list
    double-counts every point mass (BL-023). mechanism_to_json alone bakes
    point masses in and emits an empty list, so every writer (file/URL
    serialization AND undo snapshots, take_snapshot) calls
    AppState::overlay_blueprint_point_masses; undo/redo then restores the
    editable weight list with ids and labels. set_body_mass /
    set_body_izz edit the blueprint BASE value and then re-derive the live
    body's composite mass, CG and Izz (base + point masses) through
    sync_live_mass_props; never patch a single live field with a base value
    (composite CG and Izz depend on base mass) (BL-024). The parametric
    BodyMass/BodyIzz sweep varies the BASE value on a blueprint clone and
    rebuilds, so point masses stay on top of it.
  - dynamics_qv_and_multiplier_sign — M depends on theta when s_cg != 0, so
    inverse AND forward dynamics must add the velocity-quadratic force
    Q_v = assemble_quadratic_velocity_forces (solver/assembly.rs). Statics and
    inverse dynamics share Phi_q^T lambda = -(Q + Q_v - M q_ddot), so ID
    reduces to statics at rest; forward dynamics writes
    M q_ddot + Phi_q^T lambda = Q + Q_v, so its lambda has the opposite
    sign. The Python reference solvers still omit Q_v (BL-028) (BL-027).
  - point_mass_ids_unique_per_mechanism — every blueprint point mass
    (weight) has a non-blank id unique across the mechanism
    (PointMassJson { id, label?, mass, local_pos }). AppState::load_from_json_str
    calls io::assign_point_mass_ids (blank/duplicate ids -> smallest unused
    W<n>, bodies sorted by id, list order); add_point_mass uses
    io::next_point_mass_id. Address weights by (body_id, weight_id), never
    by list index.
  - weights_picked_before_joints — a Select-mode click tests weights first
    (canvas::hit_testing::find_point_mass_at, WEIGHT_HIT_RADIUS = 8 px,
    below HIT_RADIUS = 12 px so a joint under a weight stays reachable from
    its outer ring), then joints, then pins. A hit selects
    SelectedEntity::Weight { body_id, weight_id }. Drawing and picking share
    point_mass_screen_pos (AppState::body_local_to_world at the current q),
    so a weight is picked exactly where it is drawn. Ground and blank-id
    weights are neither drawn nor picked.
  - weight_drag_commits_once_on_release — canvas weight drag
    (interaction.rs handle_weight_drag) keeps only a preview in
    AppState::weight_drag (pointer snapped by GridSettings::snap_point) and
    calls move_point_mass exactly once on drag_stopped_by(Primary). The
    target is the nearest link within LINK_PICK_RADIUS (60 px, shared with
    Place Mass and Move to Link) that the blueprint has and is not ground
    (compound actuator bodies are drawn but cannot carry weights), else the
    weight's own link. The own link is a candidate too (nearest link wins,
    as the spec says), so a drop nearer its own link than a neighbour's
    stays put. A drag egui ends without a primary release (Esc) or
    a release outside the canvas rect commits nothing. The drag starts from
    pointer.press_origin(): egui reports drag_started only after the pointer
    has moved > 6 px.
  - weight_fields_commit_once_per_edit — in property_panel/weight_editor.rs
    every weight field (name, mass, body-local X/Y, in the selected-weight
    editor and the link editor's Weights section) edits a copy and emits
    ONE PendingPropertyEdit when the user finishes. committed_number keeps
    the copy in egui memory while the field is dragged or focused and
    commits on drag_stopped() || lost_focus(), but not when the committed
    number is the stored value or the number the field showed
    (format_decimal round trip), so focusing and leaving a field records
    nothing; update_while_editing(false) makes Esc drop typed text. The name
    field buffers typed text the same way and commits on lost focus
    without Esc. The + Mass toolbar field edits
    AppState::last_point_mass_kg directly (a setting, so no undo step) with the
    same weight_mass_drag_value (0.001..=1000 kg).
  - place_mass_click_snaps_and_selects — the + Mass tool's placement click
    snaps to the grid (canvas interaction.rs snapped_world, shared with the
    weight drag), adds one weight of last_point_mass_kg (one undo step),
    selects SelectedEntity::Weight and returns true so handle_interaction
    skips click selection that frame (the snap can move the weight beyond
    the pick radius of the pointer). The link editor's Add weight button
    adds last_point_mass_kg at the link's base cg_local and selects it.
  - canvas_readouts_read_the_current_sweep_sample — the canvas actuator
    label and the weight arrows/readouts all read the sweep at
    AppState::current_sweep_index (index_at_driver of the driver angle, or
    of the stroke in a stroke sweep, i.e. the sample the plot cursor marks).
    The actuator label (force_render.rs actuator_label_text calling
    format_actuator_label) shows the magnitude ("1.2 kN", "875 N", "0.35 N"),
    push for force >= SHOWN_AS_ZERO_N (0.005 N), pull for <= -0.005 N
    (positive = extension), then ", motoring" or ", braking" from
    AppState::actuator_label_power, which returns
    (WeightBreakdown::total_power[k], BRAKE_TOL_REL * max|total_power|),
    the rule of WeightBreakdown::braking and the braking bands. No word
    without an actuator breakdown; "(stored)" when the label falls back to
    the element's stored force (no finite sweep sample). Both words derive
    from REQUIRED quantities in both modes since BL-026. The force is
    sweep.actuator_forces (the plotted required force) and the power is
    the required power, so the words match the Actuator Force and Actuator
    Power plots whatever the stored force (tested at every sample with
    stored force 0, the sample's 50 N, and one above every required force).
    Weights (canvas/rendering/weights.rs draw_weights, called from
    render_overlays after the force elements so a force zone's highlight
    never covers them) draw a gold marker plus an arrow in the gravity direction (gravity_screen_dir maps g
    through the view, so it points straight down on screen under any
    mounting angle; no arrow when gravity is off), 12-40 px scaled by mass
    relative to the heaviest weight, coloured by
    classification_color(WeightBreakdown::classification(source, k)).
    weight_at_pose only uses a breakdown source with the weight's current
    id, body, local_pos and mass (rebuilds keep the old sweep until the
    debounced recompute); otherwise the arrow is WEIGHT_COLOR and the share
    reads "-". No permanent weight labels. Hover (show_weight_tooltip, same
    gate as the hover ring) or selection (card next to the marker) shows
    the title, the mass (format_mass_kg) and the signed force share with
    its classification word (a Torque share in N*m without an actuator),
    "-" near stroke reversal (weight_readout_lines). Every straight canvas arrowhead goes through
    primitives::draw_arrowhead (draw_arrow adds the shaft and clamps the
    head to the arrow length).
  - "calculator_window_owns_the_keys_it_has — Tools -> Magnetic coupling (gui/calculator_window.rs): the window has the keyboard from its opening or a press on its layer (or on the band just outside its frame where egui resizes it) until a press on another Background or Middle layer (the linkage app's panels, canvas and menu-bar buttons, another window); a press on a popup layer (Foreground: an open menu's items, a drop-down list; Tooltip; Debug) moves nothing. CalculatorWindow::show turns the panel's undo keys on only then and, after the panel drew (not while the window is collapsed to its title bar, nor on a screen without room for its frame), removes the frame's Event::Key events but egui's own zoom keys (UI_ZOOM_KEYS), so no linkage key reader runs on them. LinkageApp::update must call self.calculator.show(ctx) before every key reader (handle_keyboard_shortcuts, draw_menu_bar, handle_delete_shortcut, canvas::draw_canvas, any key_pressed): gui::tests::update_shows_the_calculator_window_before_anything_reads_the_keyboard checks the source order. The calculator's state lives in LinkageApp, never in AppState (independent of the model). The window, frame included, keeps to the screen below the menu bar and the band where egui grabs its edge, so it never covers the Tools menu: draw_menu_bar hands CalculatorWindow::set_menu_bar_bottom the bar's bottom every frame, and show constrains the window to that area with its contents capped at the area less window_chrome, so egui never clips it (menu_bar tests the_calculator_window_keeps_below_the_menu_bar; a_small_screen_keeps_the_whole_window_on_it pins window_chrome)."
  - delete_shortcut_ignores_focused_widgets — gui/mod.rs
    handle_delete_shortcut returns early while ctx.wants_keyboard_input();
    before this, Backspace in any text/number field deleted the selected
    body, joint (and would have deleted a selected weight).
  - gravity_breakdown_sources_sum_to_model_gravity — analysis::gravity_breakdown::weight_sources
    lists one link self-weight per non-ground body with positive finite base
    mass (base mass at base cg_local, id "link:<body>") plus every point mass
    the loader applies (the io::point_mass_skip_reason filter that
    io::from_json::apply_point_masses uses). Gravity is linear and the
    composite body is the mass-weighted sum, so the sources' gravity powers
    m g.v add up to the built mechanism's Q_gravity.q_dot (tested). Read g
    from the mechanism (gravity_vector), never recompute it from
    gravity_magnitude: the element carries the mounting angle.
  - point_mass_loader_validation — the loader skips (does not apply) a point
    mass on ground, a mass that is not a positive finite number, or a
    non-finite position (io::point_mass_skip_reason). Skipped weights stay in
    the blueprint (saved back unchanged); load_from_json_str pushes
    io::point_mass_warnings into error_log and opens the error panel.
    io::from_json::apply_point_masses is the only place weights reach the
    physics (the loader and sync_live_mass_props both call it), so a
    no-rebuild mass edit skips exactly what a rebuild skips.
  - weight_breakdown_sum_and_sign_conventions — WeightBreakdownBuilder::finish
    builds other_* = total_* - sum(shares), so wherever the shares are
    finite sum_i force_share[i] + other_force == total_force and
    sum_i power_share[i] + other_power == total_power (other ~ 0 when
    gravity is the only load; tested). Signs, one convention everywhere -
    actuator force positive = extension/push (forces/elements/evaluation.rs;
    tooltips and the "Rated (push)/(pull)" lines say so, never "tension");
    P_g,i = m_i g.v_i > 0 = helping (coming down); power_share = -P_g,i
    (< 0 = gives power back); force_share = -P_g,i / dL/dt also flips with
    the stroke direction, so plots colour weight lines by classification,
    never by the share's sign; braking = required power
    < -BRAKE_TOL_REL * max|P|. Since BL-026 the plotted Actuator Force and
    Actuator Power are the required values in sizing and stored-force mode
    alike, so the braking bands and the Weight Breakdown Total line follow
    the plotted curves in both modes (plot_panel::weights tests
    braking_bands_cover_exactly_the_negative_actuator_power_samples,
    total_line_is_the_plotted_required_actuator_force_and_power).
    canvas::classification_color (green helping, red hurting, gray neutral)
    is the single palette for canvas weight arrows and Weight Breakdown
    lines. Braking bands read WeightBreakdown::braking only (none when the
    sweep has no breakdown). Every plot maps sweep x to display x through
    plot_panel::sweep_x_to_display (mm in stroke mode, display angle unit
    otherwise); never inline the conversion.
  - severity_controls_return_type_not_math — Trajectory mode's
    Severity::{Strict, Analysis} runs identical Newton/FD code; the only
    difference is whether failure status bubbles as Err or as a result
    field. See solver/inverse_kinematics/solver.rs::classify_or_fail.
  - workspace_probe_cache_key — Workspace probes are keyed by
    (mech_revision, target_hash, u_range). For v1 the cache lives outside
    the solver layer (Stage 2 / AppState); the solver itself recomputes
    the probe (~64 forward solves) per call. Hot-path callers should cache
    externally — see solver/inverse_kinematics/solver.rs doc comment.
  - trajectory_mode_phi_t_override — compute_trajectory (Stage 2) overrides
    Φ_t and γ on the driver row to substitute back-solved u_dot/u_ddot.
    Constraint code in core/ remains constant-speed-parameterized. Stage 1
    solver layer doesn't yet compute this — it lives in
    gui/sweep/mod.rs::compute_trajectory in Stage 2.
  - trajectory_mode_t_mech_encoding — u_k is encoded as
    t_mech_k = (u_k − u_0) / nominal_rate to reuse existing forward solvers
    without modification. Same trick is used by solve_at_angle and
    solve_at_stroke. Mechanism::driver_row() centralizes the
    n_constraints() - 1 assumption that the driver is the last constraint
    row.
  - compute_trajectory_uses_phi_t_override — compute_trajectory in
    gui/sweep/mod.rs overrides Φ_t and γ on the driver row to substitute
    back-solved u_dot/u_ddot rather than the constant-speed driver's
    nominal rate. Constraint code in core/ remains constant-speed-
    parameterized; the override is two lines per sample.
  - compute_trajectory_dispatch_deferred_to_stage_3 — SweepMode::Trajectory
    variant exists but compute_sweep_data does not yet dispatch to
    compute_trajectory. Stage 3 introduces state.sweep_mode and wires the
    AppState::compute_sweep dispatcher to branch on it. Until then,
    compute_trajectory is reachable from code/tests but not from the UI.

known_limitations:
  - Custom 6-Bar sample is overconstrained when body_5/body_6 are merged.
    Documented in the sample JSON; solver uses SVD pseudo-inverse so it
    still works if geometry is compatible.
  - DXF body_rect_to_world forces body-local-frame geometry. Bodies added
    via DXF "Add Geometry to Link" button (target picked from the popup)
    use the world center transformed into local coords; if the target body
    is rotated at import time the geometry rectangle inherits that rotation.
  - The stroke-reversal blank-out is sample based.
    gravity_breakdown::force_share returns NaN only where |dL/dt| <
    EPS_REL_LDOT (1 %) of the sweep max, so a reversal where dL/dt changes
    fast can fall between two samples with neither inside the band. On
    ParallelogramActuator at 1 deg steps the 56.3 deg reversal is blanked
    (56 and 57 deg) but the 236.3 deg one (actuator at its shortest) is
    not; W1 of the hands-on checklist jumps from about +45 kN to -20 kN
    between 236 and 237 deg.
  - Driver reassignment on a loaded sample (AppState::current_sample is
    Some) rebuilds the stock sample (state/driver_ops.rs reassign_driver)
    and drops every blueprint edit, weights included. It is undoable, and a
    model loaded from a file (current_sample None) keeps its weights. The
    payload spec's hands-on checklist warns about it.
  - "A magcoupling design file dropped on the linkage page is read as a mechanism (the status bar says the JSON import failed); the calculator window's Load design button loads it (decision M5-9)."
  - "The calculator window's keys follow presses, not egui's keyboard focus: after Tab moves the focus from one part into the other (the window and the linkage app), the keys stay where they were until a click there (decision M5-5; backlog BL-040)."
  - "Opened while the linkage app's 'Recover Unsaved Work?' prompt shows (?tool=magcoupling with an autosave on the web, or Tools > Magnetic coupling natively), the calculator window covers the prompt; move or collapse the window to answer it (decision M5-4; backlog BL-039)."

risks:
  - Non-Grashof sweeps NaN-pad every data channel for every unreachable
    angle. Analysis code that doesn't tolerate NaN (envelopes, statistics)
    must filter it. The plot layer filters NaN; CSV/HTML export needs
    verification. Sample count = 361 for full sweeps, max-min+1 for range.
  - Two-pass statics solve adds an extra SVD per sweep angle. For 361-angle
    sweeps with complex mechanisms this roughly doubles the sweep time.
  - load_from_json_str is destructive (replaces entire mechanism). DXF
    conversion functions were migrated to additive blueprint mutation;
    any new conversion flow must do the same (push_undo + mutate + rebuild).

lessons_learned:
  - "Linkage animated HTML export (gui/export/animation.rs, File -> Export Animation (HTML)...): the page's data is built from the current sweep, never by solving again: each body's pose comes back from SweepData::body_angles and the coupler_traces of its first attachment point (by name), for every body of the built mechanism, a mount-point actuator's hidden cylinder and rod included (the reactions need them); links are the blueprint's bodies only. Reactions are solved per frame at sweep_time (gui::sweep, the sweep's own formula) and equal joint_reaction_magnitudes. animation_template.html holds one data slot, /*__ANIMATION_DATA__*/null; every < in the JSON is written \\u003c so no name can end the script or open a script comment. animation_export_available enables the menu item (a mechanism and an angle or stroke sweep)."
  - "Linkage force zones: force_zone_application (forces::elements) is the one place that decides a zone's overlap (binary) and its application point (overlap centroid, locked point, or the shape's contact point: BodyGeometry::extreme_point_world against the force). The force evaluation, the overlap ratio, the independent equilibrium check (reactions.rs) and the canvas marker all call it; never rebuild a body's outline for a zone elsewhere. A circle is a CIRCLE_SEGMENTS (64)-gon in the overlap test, a true circle on the canvas, and exact (centre plus radius) for the contact point."
  - "Linkage canvas: FORCE_ZONE_OVERLAP_FILL is a premultiplied colour with RGB above its alpha, so it adds light: anything painted under it (a gold weight, a green arrow) comes out the same yellow. Draw markers that must stay visible after draw_force_elements (BL-042)."
  - "Linkage AppState: compute_sweep reads driver_display_offset whenever the crank range is on (the stored limits are display degrees). Every path that changes the mechanism and then sweeps must call recompute_driver_display_offset first (BL-041: share links swept a shifted range)."
  - rfd file dialogs are native-only. WASM file import uses drag-and-drop
    via egui raw.dropped_files — handle both paths for any new import flow.
  - DragValue::changed() fires on every keystroke. Use drag_stopped() ||
    lost_focus() to defer expensive rebuilds until the user finishes editing.
  - Uncommitted local changes in working tree can break deploys. After any
    edit in src/gui/, ALWAYS verify WASM build succeeds before pushing.
  - The dxf crate pulls uuid, which needs features = ["js"] for WASM.
  - forces/elements/mod.rs is 1620 lines but almost entirely #[cfg(test)]
    test code. Production code lives in element_types.rs, evaluation.rs,
    force_element.rs, time_modulation.rs submodules. Do not chase this as
    a refactor target.
  - Verify "known broken" intel against the compiler before scheduling repair
    work — the tests/ struct-literal breakage was already fixed in b919485,
    but stale docs and an agent description kept reporting it for months.
  - Indented lines in /// or //! docs become rustdoc doctests when preceded
    by a blank doc line. Fence ASCII math as ```text.

  - egui Slider::step_by (and DragValue clamp/step) writes the snapped value
    back to the bound variable on idle frames. Never gate a solve/rebuild on
    "value differs from before the widget" — gate on dragged()/drag_stopped()
    or typed edits, or bind a non-stepped slider (BL-020, BL-021).
    DragValue::range also marks the response changed() when it clamps an
    out-of-range stored value on an idle frame; use
    .clamp_existing_to_range(false) on committed fields (weight mass field).
  - egui DragValue stops reporting dragged() on the release frame and
    drops its precise-value memory on any pointer release, so a DragValue
    over a copy rebuilt from the model every frame loses a mouse drag when
    it commits on drag_stopped(), since the release frame sees the old value.
    Keep the copy in egui memory while dragged/focused (weight_editor
    committed_number). Existing per-frame-copy DragValues that commit on
    drag_stopped() (ground pivot X/Y, Dist, Angle, driver RPM) still lose
    drags.
  - egui_plot fits its auto bounds to every item plus a 5 % margin
    (margin_fraction), so a shaded band sized from plot_ui.plot_bounds()
    would widen the axes on every frame. Size bands from the data's finite
    y range instead (plot_panel/weights.rs band_y_extent).

  - Rust's shortest float formatting ({:e}, Display) rounds an exact decimal
    tie half up; Python repr rounds it half to even (1662665358865589.25
    prints ...589.2 in Python). magcoupling-rs uses compat::py_repr; found by
    the generated helpers corpus, not by review.
  - Python math.ceil/floor return ints, so they never yield -0.0; Rust
    .ceil()/.floor() do for inputs in (-1, 0]. Mirror with compat::ceiling/floor_.
  - A package can dev-depend on itself to switch on a feature for its own
    tests only (magcoupling-rs workbook-parity); plain cargo test gets it,
    shipped builds and the wasm check do not.
  - "Cargo unifies a dev-dependency's features into every unit of a test build, the binaries included (cargo test --features app builds magcoupling-app with workbook-parity), so a compile_error! on a feature pair in a bin breaks cargo test. To check what a shipped binary is built with, read the features field of cargo's --message-format=json compiler-artifact lines, which lists the features each unit was actually compiled with (magcoupling_shipped.sh)."
  - "egui's Slider writes the snapped value back on idle frames only under the default SliderClamping::Always, which calls set_value(old) every frame. SliderClamping::Edits never does (magcoupling panel test idle_frames_change_no_input). Under SliderClamping::Never, arrow keys step past the range ends (egui 0.32.3 source: set_value clamps unless the clamping is Never)."
  - "egui 0.32's Context::wants_keyboard_input is true for any focused widget, a slider rail included. To know whether a text field has focus, check egui::text_edit::TextEditState::load(ctx, focused id) (magcoupling panel focused_text_field). A Slider's response takes its value box's id while the box has focus, so a row's response id names the focused text field."
  - "egui keeps a pressed key in InputState::keys_down until its release event and marks every later press of it a repeat (begin_pass), so a headless test that sends presses only holds the key down for good; tap keys instead (press and release in one frame: magcoupling test_support::key_tap). keys_down is cleared when the window loses focus."
  - "A headless test that opens several CollapsingHeaders by clicking their labels must click bottom up: a header above that opens animates the rows below over the next frames, so a click aimed at a later label can land on a slider (magcoupling idle_frames_change_no_input)."
  - "egui's default fonts have no U+2192 (the arrow) or U+2264: it draws an empty box. The magcoupling panel writes 'Torque -> Magnets' and '<=', and a test checks every drawn and hover text for glyphs (every_text_the_panel_shows_has_glyphs_in_the_default_fonts)."
  - "A panel shown with show_inside sizes from the previous frame: text added below its first-frame height is painted from the next frame on. After work done late in a frame (the magcoupling sizing solve), request a repaint so the parts drawn earlier catch up on an idle page."
  - "egui 0.32: a footer that comes and goes (the magcoupling trace banner at the foot of the inputs side) laid out as a TopBottomPanel::bottom sizes from the last frame, and its first frame's overflow grows a host egui::Window for good (the_panel_works_inside_an_egui_window caught 14 points). Lay it out with ui.with_layout(Layout::bottom_up(..)) first, then the rest in a nested Layout::top_down child: both are sized in the same frame and the rows above never move."
  - "egui's horizontal_wrapped lays a row out from the last frame's widths, so a wrapped row settles on the second frame; a headless test that clicks a wrapped tab runs one more frame first (magcoupling a_narrow_window_shows_each_row_s_label_and_value_without_scrolling)."
  - "f32::clamp(min, max) panics when min > max. A size bounded by two limits that cross at narrow widths uses min and max instead (magcoupling clamp_ui; its test draws the tab 294 and 120 points wide)."
  - "f32::min and f64::max pass over NaN (they return the other operand), so a scale taken with min over an extent that is not finite comes out finite; check the extents for finiteness first (magcoupling geometry_view::side_by_side)."
  - "egui_plot 0.33 paints a solid Line of n >= 2 points as one Shape::Path of n points and each Points marker as a Shape::Circle of its radius, so a headless test counts a plot's series by point count, in a bare frame where no other widget paints paths (magcoupling plots tests)."
  - "Windows MAX_PATH: a release build under a deep directory fails with LNK1104 (cannot open a build-script exe). Build from a short path (the worktree, or subst a drive letter)."
  - "egui: Context::input_mut can remove events mid-frame; what was drawn before reads them, everything after sees none. InputState::key_pressed and consume_key count InputState::events, so removing the Event::Key events silences every later key reader while modifiers and keys_down stay (linkage gui::calculator_window)."
  - "Never drive LinkageApp::update in a headless test: canvas::draw_canvas writes grid.spacing_m every frame and tick_save_user_prefs then writes ~/.linkage-sim/preferences.json on the developer's machine. Test the pieces update calls, in its order (gui::tests keys_frame), and pin the order with a source test."
  - "Linkage tests read RawInput::modifiers (i.modifiers.command) while egui's consume_shortcut matches each key event's own modifiers: a headless Ctrl+Z for both sets both (gui::tests keys_frame)."
  - "egui 0.32: panels (CentralPanel, SidePanel, TopBottomPanel such as the menu bar) are Background areas, so Context::layer_id_at returns a Background layer over them. A window's resize band (Interaction::resize_grab_radius_side, 5 points out from its edges; resize_grab_radius_corner, 10 points around its corners) lies outside its area, and a press there makes egui move the edge to the pointer (linkage gui::calculator_window on_resize_band)."
  - "egui 0.32: an Area paints within its constrain rect (Ui::set_clip_rect) and takes presses only there (interact_rect = rect ∩ constrain_rect), while Context::layer_id_at still reports the whole area rect. Window caps its contents at the constrain rect less its title bar, not less its frame's margins (14 points), so on a screen smaller than the window it is larger than the rect, sticks out by up to those margins (constrain_window_rect_to_area allows it, above the top too) and that part is cut off. To keep a whole window in an area: constrain_to(area) and max_size(area.size() - chrome), chrome being the frame's total margins plus the title bar (the Heading font height, at least interact_size.y, plus the frame's inner margins and stroke). A headless test sees clipping in FullOutput's ClippedShape::clip_rect, not in layer_id_at (linkage gui::calculator_window window_chrome)."
  - "egui 0.32's Resize stores the size it clamps a window to: one frame on a 0 x 0 screen (the web backend passes the canvas size as it is; egui-winit sends no screen for a zero-size window) squeezes a window to its minimum at the screen's corner for good, unless the host skips the window that frame (linkage gui::calculator_window)."
  - "eframe 0.32's web backend sets Options::zoom_with_keyboard = false (the browser zooms the page and eframe follows it) and never prevents the browser's Ctrl+Plus, Ctrl+Minus or Ctrl+0, so egui's keyboard zoom (gui_zoom::kb_shortcuts) runs natively only; a headless test sees it because egui::Context defaults it on."
  - "egui 0.32's CollapsingHeader computes its id inside a child ui (ui.vertical), so ui.make_persistent_id(salt) in the parent names another state: to open a header from code, pass CollapsingHeader::open(Some(true)) for that frame (magcoupling panel: a leaf term opens its input group)."
  - "egui 0.32: a Label in a horizontal_wrapped row wraps by laying its galley out from the row's start with leading space, so its text rect (and a test's click at its centre) starts mid-row; set ui.style_mut().wrap_mode = Some(TextWrapMode::Extend) in rows of links so each moves whole (magcoupling explorer crumbs, used-by, plot readouts)."
  - "egui 0.32: Label::sense(Sense::click()) draws the label in the interactive text colour (widgets.inactive), not the plain text colour; to make a value clickable without changing its look, put a click sensor over its rect with ui.interact (magcoupling Readouts::show_over)."
  - "egui 0.32: a ScrollArea that scrolls sideways still gives its content the viewport's width (content_max_size is the inner size), so wrapped labels inside keep wrapping and only content that does not wrap (a Grid row, a typeset formula) scrolls. A headless wheel-scroll test must put the pointer on a visible part of the area (a point past its clip rect hovers the next panel) and run several frames, since egui spreads a wheel step over frames (magcoupling explorer term list)."
  - "egui 0.32: a TopBottomPanel shown with show_inside only shrinks the parent's cursor. A widget laid out after it that forces a height still runs past the panel's top (a ScrollArea keeps at least min_scrolled_height, 64 points, unless lowered; egui_plot's Plot::height is also its min_size; an allocate_exact_size with a floor), and it paints over the panel with the parent's clip rect, which covers the panel, and takes its clicks there. Lay what follows the panel out in a child ui (new_child) whose max_rect and clip_rect (set_clip_rect, intersected with the parent's) are the space left, advance the parent by that space and never by the child's min_rect (an overflow the clip hides would grow a host egui::Window), and make each view honour available_height (magcoupling panel confined, the Equation panel). A headless test splits the frame's shapes at the panel's separator line (painted with the parent's painter after the panel's contents) and its widgets at the panel's resize handle (the panel id .with(\"__resize\"), registered after the contents); Frame::end registers a hover-only widget over its contents, so count only widgets whose sense is interactive (equation_panel_overlap)."
  - "rust_xlsxwriter 0.99.1: Workbook::new() builds DocProperties::new(), which stamps the creation time with SystemTime::now() unless its wasm feature is on and the target is wasm32; without the feature the first workbook panics in the browser. magcoupling-rs declares the same optional dependency in [dependencies] and in its wasm32 target table with features = [\"wasm\"], activated by one dep:rust_xlsxwriter in the gui feature; cargo merges the features per target, so native builds go without it."
  - "Excel takes a hyperlink of at most 2,080 characters (rust_xlsxwriter refuses a longer one: MaxUrlLengthExceeded). A magcoupling share link names every input and is about 2,500 characters, so the spreadsheet writes it as text."
  - "zip 8's deflate feature (the zip of rust_xlsxwriter and calamine) is zopfli plus flate2's zlib-rs backend, and cargo's feature unification switches flate2 to zlib-rs in every build that carries the magcoupling panel, the linkage app's share links included. The compressed bytes are the backend's: at the default design the magcoupling payload differs from the one 49fbd3f wrote (both 2,462 characters), and so does a linkage link; tests pin a link each app wrote at 49fbd3f and check that it still decodes."

