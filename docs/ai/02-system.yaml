what_it_is: |
  Planar multibody linkage simulator for engineering analysis.
  Given a mechanism defined as rigid bodies connected by joints, it computes
  kinematics (positions/velocities/accelerations), static force balance
  (joint reactions, required input effort), inverse dynamics (with inertia),
  and forward dynamics (time-domain simulation). Ships a Rust + egui GUI
  (native + WASM) with 30 sample mechanisms, 14 plot tabs, DXF import,
  sweep + parametric analysis, and HTML/CSV/SVG/GIF/DXF export.

architecture_invariants:
  - body-constraint incidence model (bodies are first-class; joints are
    constraints between them; no special-case code per mechanism type)
  - constraint-first mathematics: Phi(q,t)=0, Phi_q Jacobian, Lagrange
    multipliers. Every analysis mode layers on this one backbone.
  - SI internally (m, kg, s, N, N*m), engineering units at the GUI boundary
  - force elements are pluggable; each returns a Q contribution. Solvers
    never change when adding smooth elements.
  - drivers are constraints (add rows to Phi), not force elements

major_subsystems:
  core:
    path: linkage-sim-rs/src/core/
    responsibility: Body, constraint (revolute/prismatic/fixed/cam/driver),
      mechanism assembly, state vector management
    key_files: [body.rs, constraint/mod.rs, mechanism.rs, state.rs, driver.rs, linear_driver.rs]

  forces:
    path: linkage-sim-rs/src/forces/
    responsibility: 12 force element types (gravity, springs, dampers,
      gas spring, bearing friction, joint limit, motor, linear actuator,
      external force/torque, force zone) + evaluation to generalized Q
    key_files: [elements/element_types.rs, elements/evaluation.rs, helpers.rs]

  solver:
    path: linkage-sim-rs/src/solver/
    responsibility: kinematics (position NR, velocity, acceleration),
      statics (Phi_q^T lambda = -Q), inverse dynamics, forward dynamics
      (RK4 + Baumgarte stabilization), assembly (Jacobian, mass matrix)
    key_files: [kinematics.rs, statics.rs, inverse_dynamics.rs, forward_dynamics.rs, assembly.rs, condition.rs]

  analysis:
    path: linkage-sim-rs/src/analysis/
    responsibility: validation (Grubler, Jacobian rank), Grashof,
      transmission angle, coupler trace, energy, envelopes, motor sizing,
      virtual work, crank selection, force breakdown, per-weight gravity
      breakdown (gravity_breakdown.rs)
    key_files: [validation.rs, grashof.rs, transmission.rs, coupler.rs, energy.rs, virtual_work.rs]

  io:
    path: linkage-sim-rs/src/io/
    responsibility: JSON serialization (serde), schema versioning,
      mechanism blueprint round-trip
    key_files: [schema.rs, serialization.rs, to_json.rs]

  gui:
    path: linkage-sim-rs/src/gui/
    responsibility: all user-facing interaction. Split into multiple
      sub-modules (see 03-structure.yaml)

dataflow_on_user_change: |
  user edit -> state.blueprint mutation -> state.push_undo() -> state.rebuild()
    -> Mechanism::build() -> solve_position() -> state.q updated
    -> compute_sweep() (debounced) -> sweep_data updated -> plots/canvas redraw

two_pass_statics_for_actuators: |
  For mechanisms with a LinearActuator force element, statics is solved twice:
  1) With actuator force=0, read back driver_torque T.
  2) Compute F_actuator = T*omega/dL_dt via power balance.
  3) Re-solve statics with F_actuator injected into Q. Joint reactions now
     reflect the actuator as the prime mover (driver torque drops to ~0).

invariants_to_protect:
  - All DXF-created bodies use local=world frame (attachment points in
    world coords, body pose 0,0,0) so they render correctly without needing
    joint constraints to fix position. If you change this, you must update
    the conversion functions AND the force-zone geometry offset computation.
  - Within one sweep, ALL data channels (angles_deg, body_angles,
    coupler_traces, reactions, etc.) must share the same length. Solver
    failures push NaN rows via push_nan_row() so the alignment survives.
    The length itself is 361 only for full-range sweeps (0..=360); a
    custom range sweeps literally min..=max in 1° steps, so length is
    max-min+1. Plot consumers key off angles_deg, not a fixed count.
    SweepData::weight_breakdown (per-weight gravity breakdown) obeys the
    same rule: every per-source and total series has angles_deg.len()
    entries; push_nan_row (and the velocity-failure branch) push a NaN row
    into its WeightBreakdownBuilder.
  - weight_breakdown_total_is_required_force — gui/sweep/weights.rs
    required_totals: for an actuator, total_force = the sweep's
    actuator_forces as is. Since BL-026 that is already the required force
    in sizing and stored-force mode alike
    (solver::reactions::required_actuator_force), so never add the stored
    force again (stored_force_mode_and_sizing_mode_give_identical_breakdowns
    fails if you do). total_power = driver_torque*omega + stored*dL/dt,
    the same balance times dL/dt, finite through stroke reversal where
    actuator_forces is NaN. Without an actuator the shares are
    driver-effort shares (N*m, or N for a linear driver) with rate =
    driver rate. Force shares are NaN where |dL/dt| < 1 % of its sweep max;
    power shares and classification stay defined. A failed statics solve
    gives NaN totals, not the 0 torque the plot shows.
  - Every state mutation that changes the blueprint MUST call push_undo()
    BEFORE the mutation and rebuild() AFTER. Skipping push_undo loses undo
    history; skipping rebuild leaves mechanism out of sync with blueprint.
    Use AppState::mutate_and_rebuild(|s| ...) when possible.
  - point_mass_ops_one_undo_step_per_commit — the id-addressed weight API
    (AppState::add_point_mass -> Option<id>, move_point_mass (same body =
    reposition, other body = reattach keeping id/label/mass),
    set_point_mass_mass, set_point_mass_label, remove_point_mass_by_id;
    find_point_mass to read) validates first and pushes exactly one undo
    entry via mutate_and_rebuild. Invalid target (missing weight/body, ground
    target, mass not positive+finite, non-finite position) = false/None, no
    entry, no rebuild; a no-op edit = true, no entry. Call once per committed
    edit (drag-stop / typed value / click), never per drag frame. Move to
    Link is one move_point_mass, not remove + add (BL-025).
  - blueprint_mass_is_base_live_mass_is_composite — state.blueprint bodies
    hold BASE mass/CG/Izz plus a point_masses list; the built Mechanism
    holds the composite (base + point masses). Anything that writes a
    file/URL from the live mechanism (AppState::serialize_to_json_string)
    must write the blueprint BASE values for bodies that have point_masses,
    because load re-applies the list on top. Writing composite + list
    double-counts every point mass (BL-023). mechanism_to_json alone bakes
    point masses in and emits an empty list, so every writer (file/URL
    serialization AND undo snapshots, take_snapshot) calls
    AppState::overlay_blueprint_point_masses; undo/redo then restores the
    editable weight list with ids and labels. set_body_mass /
    set_body_izz edit the blueprint BASE value and then re-derive the live
    body's composite mass, CG and Izz (base + point masses) through
    sync_live_mass_props; never patch a single live field with a base value
    (composite CG and Izz depend on base mass) (BL-024). The parametric
    BodyMass/BodyIzz sweep varies the BASE value on a blueprint clone and
    rebuilds, so point masses stay on top of it.
  - dynamics_qv_and_multiplier_sign — M depends on theta when s_cg != 0, so
    inverse AND forward dynamics must add the velocity-quadratic force
    Q_v = assemble_quadratic_velocity_forces (solver/assembly.rs). Statics and
    inverse dynamics share Phi_q^T lambda = -(Q + Q_v - M q_ddot), so ID
    reduces to statics at rest; forward dynamics writes
    M q_ddot + Phi_q^T lambda = Q + Q_v, so its lambda has the opposite
    sign. The Python reference solvers still omit Q_v (BL-028) (BL-027).
  - point_mass_ids_unique_per_mechanism — every blueprint point mass
    (weight) has a non-blank id unique across the mechanism
    (PointMassJson { id, label?, mass, local_pos }). AppState::load_from_json_str
    calls io::assign_point_mass_ids (blank/duplicate ids -> smallest unused
    W<n>, bodies sorted by id, list order); add_point_mass uses
    io::next_point_mass_id. Address weights by (body_id, weight_id), never
    by list index.
  - weights_picked_before_joints — a Select-mode click tests weights first
    (canvas::hit_testing::find_point_mass_at, WEIGHT_HIT_RADIUS = 8 px,
    below HIT_RADIUS = 12 px so a joint under a weight stays reachable from
    its outer ring), then joints, then pins. A hit selects
    SelectedEntity::Weight { body_id, weight_id }. Drawing and picking share
    point_mass_screen_pos (AppState::body_local_to_world at the current q),
    so a weight is picked exactly where it is drawn. Ground and blank-id
    weights are neither drawn nor picked.
  - gravity_breakdown_sources_sum_to_model_gravity — analysis::gravity_breakdown::weight_sources
    lists one link self-weight per non-ground body with positive finite base
    mass (base mass at base cg_local, id "link:<body>") plus every point mass
    the loader applies (the io::point_mass_skip_reason filter that
    io::from_json::apply_point_masses uses). Gravity is linear and the
    composite body is the mass-weighted sum, so the sources' gravity powers
    m g.v add up to the built mechanism's Q_gravity.q_dot (tested). Read g
    from the mechanism (gravity_vector), never recompute it from
    gravity_magnitude: the element carries the mounting angle.
  - point_mass_loader_validation — the loader skips (does not apply) a point
    mass on ground, a mass that is not a positive finite number, or a
    non-finite position (io::point_mass_skip_reason). Skipped weights stay in
    the blueprint (saved back unchanged); load_from_json_str pushes
    io::point_mass_warnings into error_log and opens the error panel.
    io::from_json::apply_point_masses is the only place weights reach the
    physics (the loader and sync_live_mass_props both call it), so a
    no-rebuild mass edit skips exactly what a rebuild skips.
  - severity_controls_return_type_not_math — Trajectory mode's
    Severity::{Strict, Analysis} runs identical Newton/FD code; the only
    difference is whether failure status bubbles as Err or as a result
    field. See solver/inverse_kinematics/solver.rs::classify_or_fail.
  - workspace_probe_cache_key — Workspace probes are keyed by
    (mech_revision, target_hash, u_range). For v1 the cache lives outside
    the solver layer (Stage 2 / AppState); the solver itself recomputes
    the probe (~64 forward solves) per call. Hot-path callers should cache
    externally — see solver/inverse_kinematics/solver.rs doc comment.
  - trajectory_mode_phi_t_override — compute_trajectory (Stage 2) overrides
    Φ_t and γ on the driver row to substitute back-solved u_dot/u_ddot.
    Constraint code in core/ remains constant-speed-parameterized. Stage 1
    solver layer doesn't yet compute this — it lives in
    gui/sweep/mod.rs::compute_trajectory in Stage 2.
  - trajectory_mode_t_mech_encoding — u_k is encoded as
    t_mech_k = (u_k − u_0) / nominal_rate to reuse existing forward solvers
    without modification. Same trick is used by solve_at_angle and
    solve_at_stroke. Mechanism::driver_row() centralizes the
    n_constraints() - 1 assumption that the driver is the last constraint
    row.
  - compute_trajectory_uses_phi_t_override — compute_trajectory in
    gui/sweep/mod.rs overrides Φ_t and γ on the driver row to substitute
    back-solved u_dot/u_ddot rather than the constant-speed driver's
    nominal rate. Constraint code in core/ remains constant-speed-
    parameterized; the override is two lines per sample.
  - compute_trajectory_dispatch_deferred_to_stage_3 — SweepMode::Trajectory
    variant exists but compute_sweep_data does not yet dispatch to
    compute_trajectory. Stage 3 introduces state.sweep_mode and wires the
    AppState::compute_sweep dispatcher to branch on it. Until then,
    compute_trajectory is reachable from code/tests but not from the UI.

known_limitations:
  - Custom 6-Bar sample is overconstrained when body_5/body_6 are merged.
    Documented in the sample JSON; solver uses SVD pseudo-inverse so it
    still works if geometry is compatible.
  - DXF body_rect_to_world forces body-local-frame geometry. Bodies added
    via DXF "Add Geometry to Link" button (target picked from the popup)
    use the world center transformed into local coords; if the target body
    is rotated at import time the geometry rectangle inherits that rotation.

risks:
  - Non-Grashof sweeps NaN-pad every data channel for every unreachable
    angle. Analysis code that doesn't tolerate NaN (envelopes, statistics)
    must filter it. The plot layer filters NaN; CSV/HTML export needs
    verification. Sample count = 361 for full sweeps, max-min+1 for range.
  - Two-pass statics solve adds an extra SVD per sweep angle. For 361-angle
    sweeps with complex mechanisms this roughly doubles the sweep time.
  - load_from_json_str is destructive (replaces entire mechanism). DXF
    conversion functions were migrated to additive blueprint mutation;
    any new conversion flow must do the same (push_undo + mutate + rebuild).

lessons_learned:
  - rfd file dialogs are native-only. WASM file import uses drag-and-drop
    via egui raw.dropped_files — handle both paths for any new import flow.
  - DragValue::changed() fires on every keystroke. Use drag_stopped() ||
    lost_focus() to defer expensive rebuilds until the user finishes editing.
  - Uncommitted local changes in working tree can break deploys. After any
    edit in src/gui/, ALWAYS verify WASM build succeeds before pushing.
  - The dxf crate pulls uuid, which needs features = ["js"] for WASM.
  - forces/elements/mod.rs is 1620 lines but almost entirely #[cfg(test)]
    test code. Production code lives in element_types.rs, evaluation.rs,
    force_element.rs, time_modulation.rs submodules. Do not chase this as
    a refactor target.
  - Verify "known broken" intel against the compiler before scheduling repair
    work — the tests/ struct-literal breakage was already fixed in b919485,
    but stale docs and an agent description kept reporting it for months.
  - Indented lines in /// or //! docs become rustdoc doctests when preceded
    by a blank doc line. Fence ASCII math as ```text.

  - egui Slider::step_by (and DragValue clamp/step) writes the snapped value
    back to the bound variable on idle frames. Never gate a solve/rebuild on
    "value differs from before the widget" — gate on dragged()/drag_stopped()
    or typed edits, or bind a non-stepped slider (BL-020, BL-021).
    DragValue::range also marks the response changed() when it clamps an
    out-of-range stored value on an idle frame; use
    .clamp_existing_to_range(false) on committed fields (weight mass field).

