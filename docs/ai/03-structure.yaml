layout:
  root: linkage-sim-rs/
  source: src/
  tests: tests/
  data: data/ (golden fixtures)
  docs: ../docs/

reference:
  path: reference/ (repo root, outside linkage-sim-rs/; upstream code kept verbatim as test oracles, see reference/README.md)
  magcoupling_py:
    path: reference/magcoupling-py/
    role: vendored magcoupling 1.0.0 (Python port of magnetic_coupling_torque_calculator.xlsx); read-only oracle for the magcoupling M1 audit and the Rust port magcoupling-rs (M2)
    engine: magcoupling/ (READ-ONLY, never edit; parity and differential tests compare against it unchanged)
    parity_suite: tests/ (test_parity.py checks every workbook formula cell against reference_values.json; test_api.py; test_optional.py needs the magpylib and matplotlib extras)
    tools: tools/extract_reference.py (regenerates tests/reference_values.json from the workbook); tools/gen_differential.py (writes magcoupling-rs/tests/data/python_schema.json, static_data.json and differential/*.json (one file per result group, plus full.json, the run that varies all inputs at once) from the engine, with slider ranges read from magcoupling-rs/tests/data/input_schema.json, leaving out every row whose rust_only flag is true so a Rust-only input keeps its Rust default in every case; --check verifies they are current)
    venv: .venv/ (gitignored; created from requirements-audit.txt, see running below)
  audit:
    path: reference/magcoupling-py/audit/
    references: audit/references/ (independent reference models per formula family - 2D field, slab field, block geometry, metal stack, remanence, slip and thermal, sweeps, clamps, units)
    tests: audit/tests/ (every check carries @pytest.mark.family; conftest.py enforces the marker on audit items only, so it can share a session with tests/; *_reference_sanity.py files self-test the references; test_harness_smoke.py covers the harness and the conftest rule)
    tools: audit/tools/ (group_candidates.py groups failures by root cause, coverage_table.py prints the confirmed-correct table, placeholder_sensitivity.py prints placeholder sensitivities)
    out: audit/out/ (generated results.json, candidate_groups.json, coverage.md and more; gitignored, regenerate by running the suite)
    report: docs/analyses/2026-09-29-magcoupling-math-audit.md (findings E1..E14, M1..M15, P1..P3) and docs/analyses/2026-09-29-magcoupling-audit-results.json (raw results with skeptic verdicts)
    plan: docs/superpowers/plans/2026-09-29-magcoupling-m1-math-verification.md
    expected_result: 46 failing checks (32 root-cause groups, all classified in the report) among 790 checks; the failures document engine or workbook errors, they are not regressions
  running:
    setup: "cd reference/magcoupling-py; python -m venv .venv; ./.venv/Scripts/python -m pip install -e . -r requirements-audit.txt (Windows layout; use .venv/bin/python on POSIX)"
    parity_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests"
    audit_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q audit/tests -p no:cacheprovider (writes audit/out/results.json)"
    both_in_one_session: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests audit/tests -p no:cacheprovider"
    audit_tools: "cd reference/magcoupling-py; ./.venv/Scripts/python -m audit.tools.group_candidates | coverage_table | placeholder_sensitivity (run after the audit suite; set PYTHONIOENCODING=utf-8 on Windows for coverage_table)"

magcoupling_rs:
  path: magcoupling-rs/ (repo root, sibling of linkage-sim-rs/; separate crate, NOT a workspace member)
  role: Rust port of reference/magcoupling-py (spec docs/superpowers/specs/2026-09-28-magcoupling-calculator-design.md); M2 complete - every Python module except fields3d (M3) is ported, workbook parity covers all 1,149 checks, E1-E14 applied; Addendum A-1 (grades, materials, E15-E20), A-2 (harmonic set, assumptions, inverse sizing, space claim) and A-3 (equation explorer engine side - evaluable records, drift guard, A3 traceability, A4 notes) complete; M4 infrastructure adds the egui panel, the standalone app binaries and the /magcoupling/ web bundle; M4-1 adds the inputs, dashboard, results table, session (undo/redo, design files, share links), sizing mode and theme; M4-2 adds the geometry view, five plots (egui_plot) and the clamp drawing and table; M4-3 adds the equation explorer (typesetter, hover, Equation panel), the assumptions view and banner, the teaching notes and diagrams, the material, part and grade pickers and the material warnings; guidance slice 1 (BL-055) adds gui/guidance.rs (check guides, design status, what-moves-what lines), the one torque number, the Size tab's Auto solver and the Size tab as the first view
  guide: magcoupling-rs/README.md (tests, regenerating data, porting a module, Python-to-Rust translation rules, applying deviations)
  lib: magcoupling (src/lib.rs re-exports compute_all, headline, DesignInputs, DesignResults; mod gui behind feature gui, mod app behind feature app)
  engine: src/engine/ (pure std, wasm32-clean; one module per Python module)
  engine_files:
    meta: meta.rs (inputs!/results!/rows! macros, param/out and col/at_row/uncelled_col builders, slider range (SliderRange::step_from, one slider step kept on the slider, the step a fix and a note's change entry take), assumption flag, Value, InputSet get/set/visit and ResultSet get/visit by dotted path (a table row's field as table[i].field), validate (the set() checks on a whole input struct); table rows via RowSet and TableLayout with synthesized cells, results! tables section)
    compat: compat.rs (py_min/py_max, ceiling/floor_, text0, py_repr, fmt_num, fmt_fixed, parity_close)
    deviations: deviations.rs (REGISTRY of the M1 corrections E1-E14 and the Addendum A corrections E15-E20 (report docs/analyses/2026-09-30-magcoupling-addendum-a-verification.md, section 8 decisions via Approval::Addendum); depends_on (E15-E17 on E9); Deviations switch; registry Probe entries and changes_file golden-file names; NONE/only()/with()/without() and restore_workbook_defaults behind the test-only workbook-parity feature)
    constants: constants.rs (MU0 = 1.256637e-06, the workbook's rounded value; NDFEB_DENSITY_G_MM3)
    library: "library.rs (Magnet library rows = the A6 part table: workbook values, grade, vendor page, coating, magnetization; the exact-text lookup; br_T applies E3 with grades::N42SH.br_T; tmax_C and grade_id apply E19, the vendor grid of the SuperMagnetMan arcs)"
    warnings: "warnings.rs (Addendum A5 material warnings: WARNING_RULES, six rules with text, Severity and note id; thresholds SLEEVE_SIGMA_BASELINE_S_M 1.35e6, LOW_SATURATION_T 1.7, CTE_MISMATCH_LIMIT_PER_C 15e-6; WarningResults = DesignResults::warnings, Rust-only)"
    material_library: "material_library.rs (Addendum A5 materials library MATERIALS, 14 entries cited per value; EngineProps = workbook numbers where they exist (decisions 21-26), else sourced; BACK_IRON_CHOICES, SLEEVE_LINER_CHOICES, CAP_HOUSING_CHOICES, code 1 = the workbook's material; resolve -> PartProperties: the circuit in effect, the design flux density, the steel, body (no back iron), sleeve and cap values the engine reads)"
    grades: grades.rs (Addendum A6 grade table GRADES, 17 grades cited per value from docs/analyses/2026-09-30-magcoupling-addendum-a-data.json; grade(id); N42SH keeps the workbook Hcj 1592 and beta -0.005)
    calibration: "calibration.rs (Calibration sheet, 23 result cells, 16 default inputs; compute takes the Calculator's harmonic set; Rust-only tau7_Pa-tau11_Pa and end_effect_check)"
    assumptions: "assumptions.rs (Addendum A3 panel: ASSUMPTIONS, 14 rows over the 15 inputs flagged .assumption() with rationale and source; Assumption::shown(clamps_paused), false for the clamp friction and the preload fraction while the shaft-clamp section is paused; states, modified, any_modified, reset_to_workbook_defaults; the dependency-graph traceability test is plan A-3's)"
    sizing: "sizing.rs (Addendum A1 inverse sizing: FreeVariable (axial length, magnets per ring, ring radius; range, grid and grid_in(range), the scan's cells over a caller's range), SCAN_CELLS 64, VALUE_TOLERANCE_MM 1e-9, is_valid (decision A2-4), solve_in(inputs, variable, target, range) and solve (the same over variable.range()) -> Solved / NotReachable {best}: the scan refined at the first crossing, each peak and each validity edge; SizingError (InvalidRange {min, max} for a range with a non-finite end or min > max); the search's unit tests drive it with plain functions)"
    size_controls: "size_controls.rs (manual overall dimensions: dimensions -> SizeControls with the outside diameter, axial stack and metadata-derived ranges; resize_diameter links the hub apothem, cap OD and thread by the cup change; resize_length uses the existing axial override and housing allowances; explicit minimum OD APIs expose a shaft/boss/cap/thread-bounded exploration floor below the legacy radius minimum; same-size no-op and finite/range refusal; slice 1 adds diameter_breakdown (DiameterBreakdown: cap, cup and boss mm, the largest being dimensions' outside diameter), length_breakdown (LengthBreakdown: magnets mm + housing mm = dimensions' overall length), smallest_fitting_diameter -> DiameterFit {At, AtMinimum, Nowhere} (bisection of model::blocks_fit to 1e-6 mm over the Size tab's diameter range), ring_radius_range (that range as coupling.inner_back_apothem_mm, for ring-size Auto) and with_ring_radius (a ring radius applied through the Outside diameter slider's own mapping, so the cap OD and cap thread follow the cup; None where that mapping refuses), each reusing dimensions' own expressions)"
    housing: "housing.rs (Addendum A1 housing: axial_housing, the hub length, cup cavity depth and retainer span in effect, which follow the length override, decision A2-8; the space claim: HousingResults = DesignResults::housing, Rust-only overshoot per axis, space_claim_check and the three dimensions in effect; the autofit classes of report 6.5 in its module doc)"
    gearbox: "gearbox.rs (BL-059 gearbox check: GearboxResults = DesignResults::gearbox, Rust-only cold_high_check, computed in api.rs beside housing::compute: cold-high at the gearbox input (metal.cold_high_input_Nm) against coupling.gearbox_input_rating_Nm, owner decision 1A, the same test as cold-high against model.gearbox_reference_Nm at the output; WITHIN_THE_GEARBOX_RATING, ABOVE_THE_GEARBOX_RATING (the failing text's start: both torques to 0.01 N m, the torque at least 0.01 above the rating as quoted), GEARBOX_CHECK_UNKNOWN (NaN in either); at the rating passes, +inf fails; a peak check only, the fatigue check is BL-066)"
    model: "model.rs (Calculator sheet: inputs (Rust-only grade_inner/grade_outer: a grade for manual dimensions, Addendum A6; max_harmonic, the A3 harmonic set, MAX_HARMONIC_CHOICES, harmonic_count; axial_length_mm, the A1 length override), ModelResults 73 result cells (Rust-only inner_grade/outer_grade, tau7_Pa-tau11_Pa, end_effect_check, each ring's alpha and magnet density), HARMONICS [1, 3, 5] (the workbook set) and ODD_HARMONICS [1..11], peak_off_half_pitch (one root search for any odd set, decision 29), peak_angle (the one E7 gate), tau_at and at_pull_out (E7), harmonic_sum/harmonic_slot, end_effect_in_range/end_effect_check (audit M9 flag), pitch_share and blocks_fit (the A2-4 fit rule: flats, or arcs that do not overlap), ResolvedMagnet::alpha_br/density_g_mm3 (grade mode, decision A2-7), corner_radius and br_factor (shared across sheets); mass_estimate and MassResults, 6 result cells)"
    metal_design: "metal_design.rs (Metal design sheet: MetalDesignInputs 48 fields; retainers, 9 result cells; compute, MetalDesignResults 49 result cells; VALIDATION_ITEMS)"
    materials: "materials.rs (Materials sheet: inputs, plus the Rust-only part selectors materials.parts (back_iron, sleeve_liner, cap_housing); AL7075 and AL6061 alloys; ScrewClasses::proof, NaN for a code outside 1-3; compute, MaterialsResults 7 result cells plus the Rust-only cup_wall_suggested_mm, the A1 autofit's wall, decision 27; CUP_WALL_TOO_THIN, the failing cup wall verdict's prefix, which gui::dashboard::verdict_display reads, R9)"
    temperature: "temperature.rs (Temperature design sheet: 7 input groups, 37 cells; ADHESIVES table and selected_adhesive, NO_ADHESIVE (NaN, \"#N/A\") for a code outside 1-4; TemperatureLinks; compute, TemperatureResults 130 result cells and the uncelled adhesive name; demag_onset_C, cold_onset_C (E20, positive beta), ring_demag (E20: each ring's check, the weaker governs, A13), volkersen_peak_shear_MPa; Rust-only coercivity_source and the free-space fields of E17; stored_3d_sentence! (crate-visible macro: the stored-3D help sentence, typed once; its free-space helps, the GUI overlay and gui::dashboard::STORED_3D_SENTENCE read it); Rust-only demag results hcj20_used/beta_used, demag_ring, cold_ring and the cold side)"
    clamps: "clamps.rs (Shaft clamps and Clamp screw sizes sheets: 25 input cells; SCREW_SIZES, TABLE_COLUMNS, MACHINING_STEPS; ScrewRow with 34 fields and 165 table cells; screw_class_name, \"#N/A\" for a code outside 1-3; compute, ClampResults 33 result cells plus the Rust-only length_note; the screw table lists after the scalars; PAUSED (slice-2 ruling 11, 2026-10-15: true, the panel hides the section; false brings it back with no other edit), SECTION (the paused path prefixes clamps. and materials.screws.) and hides(path, paused))"
    sweeps: "sweeps.rs (Gap sweep and Pole sweep sheets: GAP_SWEEP_CORNER_GAPS_MM, POLE_SWEEP_POLES; SweepRow with 26 fields, 338 and 156 table cells; SweepContext with 20 fields (Python's 19 plus bond_inner, read only by E4); gap_sweep, pole_sweep)"
    picks: "picks.rs (guidance slice 2: set_by_pick, the pick input that sets an input in place of its value on a design: back iron other than 4140 (steel values; the circuit selector for 304 and 6061; 1018's design flux density), sleeve and liner other than 316L, a ring's library part (its manual fields and grade), a grade on custom dimensions (the manual Br); BACK_IRON_PICK, SLEEVE_LINER_PICK; the tests nudge every input on every pick)"
    api: api.rs (DesignInputs/DesignResults groups in Python order, the complete Python DesignResults; compute resolves the part materials first (material_library::resolve) and feeds the values in effect; compute_all applies Deviations::ALL; headline and HEADLINE (the 15 dashboard numbers, Python order, read with ResultSet::get, about 0.4 us per call in release); OPTIONAL_SEEDS (the result an optional input enters at, which gui::inputs re-exports); DesignInputs::validate; test-only compute_all_with, DesignInputs::defaults_with)
    ported: [meta.rs, compat.rs, constants.rs, calibration.rs, library.rs, grades.rs, material_library.rs, warnings.rs, model.rs, metal_design.rs, materials.rs, temperature.rs, clamps.rs, sweeps.rs, api.rs]
    explain: "explain/ (Addendum A2-A4 equation explorer, engine side, plan A-3: markup.rs formula and symbol grammar, parser and tree (inf, nan, ceilto, floorto, fmt, fmtnum, concat); eval.rs evaluator with Trace (value and condition terms, arms taken); tables.rs static tables a formula reads; record.rs Record/Family/Eval and records/ (torque, demagnetization, slip_heating, temperature, clamps, dashboard, geometry; #[rustfmt::skip] data); registry.rs Registry::build, equation_for, used_by, graph, upstream, downstream, upstream_inputs, term_rows, family_members, term_style, modified_assumptions_upstream, choices, corrections_upstream; symbols.rs SYMBOLS; scope.rs SCOPE (decision 31 plus the G1 geometry callouts, 169 paths, all explained); notes.rs NOTES (20 notes, 19 shown while the clamp section is paused; the cap: the 17 A4 notes plus slice 2's torque_from_shear, hot_low_cold_high and when_slipping; START_HERE_ALL, 14 steps in the slice-2 order, torque_from_shear first, hot_low_cold_high step 8 after br_temperature, when_slipping step 9 before slip_heating, the clamp step last; start_here_for(clamps_paused) (a const fn: the order less its clamp step while paused) and START_HERE = start_here_for(clamps::PAUSED), the order the panel walks, 13 steps while paused; PAUSED_NOTE (clamp_preload, which stays in NOTES unchanged), shown_when(id, clamps_paused) and shown(id) (every note but clamp_preload while paused); Review gate, note_for; plain_words_problems(note, value), the one plain-words rule for a note (a banned word or an audit id in its title, its sources or its texts drawn with live values), which tests/explain.rs every_note_reads_in_plain_words_at_every_probe_design runs over the notes shown at the five probe designs; slice 2: Note {id, title, equations, sentences 3-5, change: 1-5 [Change {input, step: Step (Raise, Lower, Choose, Enter; word, up), aim: Option<(result, Sense)> (Sense::holds: the one aim rule of the aim test and the review sheet), text}], watch_out: 0-2 [..], diagram, sources, review}, the caps and sentence-0 tests over the notes shown, on since T18 (every_note_keeps_to_the_slice_2_caps, every_sentence_zero_is_plain_words), the cfg(test) module before reading docs/analyses/2026-10-14-magcoupler-notes-before.txt, the plain-words rule's own test (each kind of mistake named, a live value read as drawn), the caps per id for T15's three in A-15's form, the_slip_notes_keep_the_caps, and T16's two, the_demagnetization_notes_keep_the_caps, the T16 guards no_note_says_the_coupling_protects_the_gearbox (every note) and the_rewritten_notes_type_no_editable_default (the demagnetization notes), T17's the_wall_and_sleeve_notes_own_the_rows_slice_2_gives_them (a5.low_saturation owns the wall rule's rows, a5.high_conductivity_sleeve_or_liner the sleeve conductivity, a5.non_ferromagnetic_back_iron the circuit); SLICE_2_ORDER); note_text.rs (segments, render, rendered_texts, placeholders, NO_VALUE: live {result.path} values); probes.rs (probe_designs, PROBE_NAMES: the five probe designs; step_input, Unmoved: one slider step of an input); render.rs plain text; plain.rs the plain-words guard: BANNED, plain_text_violations, word_count, sentence_count, audit_ids (TC-, PA-, CG-, which the notes' texts are held to as well), mentions_gearbox_protection (BL-059: the one gearbox-protect rule the note, guide and overlay bans call), pure std so gate 4 runs it, re-exported by gui::guidance)"
    addendum_only: [assumptions.rs, sizing.rs, housing.rs, gearbox.rs, explain/]
    remaining: [fields3d (M3)]
  features:
    gui: "src/gui/ (egui 0.32, egui_plot 0.33, serde_json, base64, flate2, log, rust_xlsxwriter 0.99.1 (its wasm feature and js-sys on wasm32); no eframe, no I/O): typeset.rs (the equation typesetter: layout, layout_equation, layout_symbol -> Laid of Ink; TermColors (of, with_members, with_marked), TERM_PALETTE; glyph_safe; equation_ui, laid_ui, term_at), readouts.rs (registry (OnceLock, built once), Readouts (new(marks, show_details), show_details, show and show_over (the hover text built with the frame's show_details), mark, open_note, finish -> ReadoutEvents), OPEN_HINT, MARK_WIDTH, REGISTRY_LOG_PREFIX), explorer.rs (Explorer: open, trail, hovered, focus, explain, start_here, note; open_path, drill, back_to, follow, focus_input, take_scroll, close (clears the focus), open_note, start, stop, marks, end_frame, follow_note_link; explorer_ui (with the held closure), note_ui (NoteView, NoteLink; WHAT_TO_CHANGE, WATCH_OUT, WHERE_FROM, HELD_BY_AUTO, AT_TOP, AT_BOTTOM), START_HERE_BUTTON and START_HERE_HOVER (the walk's topics in START_HERE's order, plain words: start_here_hover(clamps::PAUSED), the clamp topic only while the section is not paused), used_by_shown (the Used by links less the paused section's results), held_reason, live_value (a note's {result.path} as the readouts show it; none, drawn as no prediction, where there is none), term_tag, term_label, plain_symbol, reviewed_note (every note shown by id), note_fallback -> NoteFallback {Note, Assumption, Reason} (Explain's next best read under an equation without a note, or a value with no record: the dashboard row's Why link, else the nearest reviewed note upstream, else the nearest assumption, else the row's reason or NO_NOTE), EMPTY_TEXT, NO_NOTE, START_HERE_HINT, NEAREST_NOTE, NEAREST_ASSUMPTION, NoteLink::Note (the closest note's link; follow_note_link opens it), start_here_text (FERRITE_ONLY on the ferrite step); EQUATION_PANEL, panel_heights (the panel's drag range and starting height: PANEL_SHARE 0.45 of the centre region, MIN_PANEL_HEIGHT 120, its top edge stopping VIEW_STRIP 160 below the region's top), MAX_TRAIL, SHOWN_CRUMBS, ELIDED, FOCUS_WIDTH, SWATCH_DIM; its tests hold notes_signoff_sheet (ignored: the owner's sign-off sheet, docs/analyses/2026-10-14-magcoupler-notes-signoff.md, each note shown before slice 2 from notes::before's snapshot and as it ships at the default design, with its review record; signoff_sheet(clamps_paused) says why the clamp note is not on it while paused)), diagrams.rs (diagram_shapes, diagram_ui, DIAGRAM_SIZE: the six notes::Diagram kinds), pickers.rs (MATERIAL_PICKERS, PART_PATHS, GRADE_PATHS, picker_ui, choice_hover, material_of, material_summary, material_properties, part_label, part_properties, grade_label, grade_properties), plain_text.rs (slice 2: the display-name and help overlay keyed by path; label_for, help_for, original_help, hint_for, NO_SPREADSHEET_CELL (the provenance line of an input or result without a cell), CUP_WALL_INPUT and shown_literal (R9: the cup wall verdict's text literal with the wall input's label, drawn by the typesetter and verdict_display), display_label (for callers that hold the metadata, and the catalogue while it is built); LABELS (spec 3.5's nine canonical names and the gearbox ripple row's, BL-059; REQUIRED_TORQUE, PULL_OUT_NOMINAL and HOT_LOW_TORQUE are the three the Size tab and the plots draw too, typed once), HELP (help batch A, T7: every input of the Requirements, Magnets and rings, Gap and clearances and Shaft, key and clamps groups; help batch B, T8: the 52 empty and 25 replaced helps of the Calibration and model, Materials, Housing and retainers and Thermal and demagnetization groups, and six overrides elsewhere, three of them results; BL-059: the gearbox ripple row's help (a result) and the gearbox rating's, rewritten to name the gearbox check; the caveat that ends each row of four clusters (stored 3D fields, bench prototype, unmeasured defaults, optional adapter) is typed once, as a macr