layout:
  root: linkage-sim-rs/
  source: src/
  tests: tests/
  data: data/ (golden fixtures)
  docs: ../docs/

reference:
  path: reference/ (repo root, outside linkage-sim-rs/; upstream code kept verbatim as test oracles, see reference/README.md)
  magcoupling_py:
    path: reference/magcoupling-py/
    role: vendored magcoupling 1.0.0 (Python port of magnetic_coupling_torque_calculator.xlsx); read-only oracle for the magcoupling M1 audit and the planned Rust port (M2)
    engine: magcoupling/ (READ-ONLY, never edit; parity and differential tests compare against it unchanged)
    parity_suite: tests/ (test_parity.py checks every workbook formula cell against reference_values.json; test_api.py; test_optional.py needs the magpylib and matplotlib extras)
    tools: tools/extract_reference.py (regenerates tests/reference_values.json from the workbook)
    venv: .venv/ (gitignored; created from requirements-audit.txt, see running below)
  audit:
    path: reference/magcoupling-py/audit/
    references: audit/references/ (independent reference models per formula family - 2D field, slab field, block geometry, metal stack, remanence, slip and thermal, sweeps, clamps, units)
    tests: audit/tests/ (every check carries @pytest.mark.family; conftest.py enforces the marker on audit items only, so it can share a session with tests/; *_reference_sanity.py files self-test the references; test_harness_smoke.py covers the harness and the conftest rule)
    tools: audit/tools/ (group_candidates.py groups failures by root cause, coverage_table.py prints the confirmed-correct table, placeholder_sensitivity.py prints placeholder sensitivities)
    out: audit/out/ (generated results.json, candidate_groups.json, coverage.md and more; gitignored, regenerate by running the suite)
    report: docs/analyses/2026-09-29-magcoupling-math-audit.md (findings E1..E14, M1..M15, P1..P3) and docs/analyses/2026-09-29-magcoupling-audit-results.json (raw results with skeptic verdicts)
    plan: docs/superpowers/plans/2026-09-29-magcoupling-m1-math-verification.md
    expected_result: 46 failing checks (32 root-cause groups, all classified in the report) among 790 checks; the failures document engine or workbook errors, they are not regressions
  running:
    setup: "cd reference/magcoupling-py; python -m venv .venv; ./.venv/Scripts/python -m pip install -e . -r requirements-audit.txt (Windows layout; use .venv/bin/python on POSIX)"
    parity_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests"
    audit_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q audit/tests -p no:cacheprovider (writes audit/out/results.json)"
    both_in_one_session: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests audit/tests -p no:cacheprovider"
    audit_tools: "cd reference/magcoupling-py; ./.venv/Scripts/python -m audit.tools.group_candidates | coverage_table | placeholder_sensitivity (run after the audit suite; set PYTHONIOENCODING=utf-8 on Windows for coverage_table)"

modules:
  core:
    bodies: src/core/body.rs
    constraint: src/core/constraint/ (mod.rs + revolute, prismatic, fixed, cam, trait_def)
    driver: src/core/driver.rs
    linear_driver: src/core/linear_driver.rs
    mechanism: src/core/mechanism.rs
    state: src/core/state.rs

  forces:
    elements: src/forces/elements/ (element_types.rs, evaluation.rs, force_element.rs, time_modulation.rs, mod.rs)
    helpers: src/forces/helpers.rs
    compound: src/forces/compound.rs

  solver:
    assembly: src/solver/assembly.rs
    kinematics: src/solver/kinematics.rs
    statics: src/solver/statics.rs
    inverse_dynamics: src/solver/inverse_dynamics.rs
    forward_dynamics: src/solver/forward_dynamics.rs
    events: src/solver/events.rs
    condition: src/solver/condition.rs

  analysis:
    path: src/analysis/
    files: [validation, grashof, transmission, coupler, energy, envelopes, motor_sizing, virtual_work, crank_selection, force_breakdown, gravity_breakdown]
    notes:
      gravity_breakdown: per-weight gravity power P_g,i = m_i g.v_i (weight_sources from the blueprint = link self-weights + applied point masses; gravity_powers; gravity_vector; classify / force_share / is_braking with EPS_REL_LDOT, NEUTRAL_REL, BRAKE_TOL_REL; display names display_name, name_with_id, point_mass_title shared by the plot legend, the property panel and the canvas). Pure, no GUI deps.

  io:
    path: src/io/
    files: [schema, serialization, to_json]

  geometry:
    path: src/geometry/
    responsibility: low-level 2D geometry helpers (polygon clipping, body_rect_to_world, centroid)

  gui:
    path: src/gui/

gui_submodules:
  canvas:
    path: src/gui/canvas/
    files:
      mod: canvas/mod.rs (top-level canvas orchestration)
      interaction: canvas/interaction.rs (drag, pan, zoom, tool handlers; weight hover/drag - weights_interactive, handle_weight_drag, weight_drop_target)
      rendering:
        mod: canvas/rendering/mod.rs (main render pass, overlays, tooltips, grid, background image)
        primitives: canvas/rendering/primitives.rs (springs, dampers, arrows - draw_arrowhead is the one straight-arrow head, draw_arrow = shaft + head; arcs, markers, alignment guides)
        force_render: canvas/rendering/force_render.rs (force element visualization + load-path heat map; actuator label text actuator_label_text / format_actuator_label, with the required force from AppState::actuator_label_force and motoring/braking from AppState::actuator_label_power; format_magnitude)
        weights: canvas/rendering/weights.rs (payload weights on the canvas - draw_weights draws markers + gravity arrows coloured by classification at AppState::current_sweep_index; show_weight_tooltip and the selected-weight card show weight_readout_lines; weight_at_pose, weight_arrow_length_px, gravity_screen_dir; place_mass_hint)
      hit_testing: canvas/hit_testing.rs (body-segment projection; weight picking find_point_mass_at + point_mass_screen_pos, which drawing shares)
      colors: canvas/colors.rs (includes classification_color, re-exported as canvas::classification_color — the one helping/hurting/neutral palette for weight arrows and Weight Breakdown lines)
      context_menu: canvas/context_menu.rs
      alignment: canvas/alignment.rs

  state:
    path: src/gui/state/
    files: [mod, blueprint_ops, driver_ops, entity_crud, file_io, grid, load_cases, parametric, simulation, solver_helpers, templates, types, undo_ops, view_transform, display_units, tests]

  property_panel:
    path: src/gui/property_panel/
    files: [mod, diagnostics, force_editor, health, pending_edits, undo_panel, weight_editor]
    notes:
      weight_editor: selected-weight editor (draw_selected_weight) and the link editor's Weights section with Add weight (draw_link_weights); shared fields draw_weight_fields; committed_number (commit once per edit); weight_mass_drag_value (also the + Mass toolbar field)

  plot_panel:
    path: src/gui/plot_panel/
    files:
      mod: plot_panel/mod.rs (PlotTab enum incl. WeightBreakdown, dispatcher, shared helpers incl. sweep_x_to_display - the one sweep-x to display-x conversion; Weight Breakdown force/power toggle bound to AppState::weight_breakdown_show_power)
      mechanics: plot_panel/mechanics.rs (body angles, transmission, MA, joint reactions)
      dynamics: plot_panel/dynamics.rs (driver torque, inverse dynamics, energy)
      actuator: plot_panel/actuator.rs (force, speed, power; force plot draws every finite sample — no outlier filter, BL-010; force and power plots shade braking bands via weights::draw_braking_bands)
      weights: plot_panel/weights.rs (payload weights - Weight Breakdown tab draw_weight_breakdown, one line per weight source + Other loads + Total, force or power share, runs coloured per sample by classification; braking bands braking_bands / band_y_extent / draw_braking_bands; pure assembly breakdown_lines, source_line_name, breakdown_y_label)
      coupler: plot_panel/coupler.rs (trace, velocity, acceleration, output force)

  samples:
    path: src/gui/samples/
    files: [mod, fourbar, sixbar, special, helpers, custom_6bar.json]

  export:
    path: src/gui/export/
    files: [mod, svg, dxf, csv, raster, report, schematic, firmware]
    notes:
      schematic: Auto-generated labeled mechanism schematic (SVG) — File → "Export labeled schematic (SVG)..."; matches docs/superpowers/specs/2026-04-29-linkage-equations-reference.md figures 2 & 3.

  sweep:
    path: src/gui/sweep/
    files:
      mod: sweep/mod.rs (SweepData + SweepData::index_at_driver (nearest sample to the current driver angle/stroke, circular in angle mode — BL-010), compute_sweep_data, solve_sweep_positions two-pass Newton continuation for full-revolution sweeps — post-gap samples reached backward from 360 deg on the starting branch (BL-011), push_nan_row helper)
      motion_profile: sweep/motion_profile.rs (trapezoidal velocity profile, apply_motion_profile; SCurve falls back to ConstantSpeed in driver-side mode)
      fourbar: sweep/fourbar.rs (4-bar linkage detection for transmission angle)
      weights: sweep/weights.rs (payload weights - WeightBreakdown {sources, basis, gravity_power, force_share, power_share, other_force, other_power, total_force, total_power, braking} + classification() and classifications() (per-sample class of one source, band computed once; the plot colours lines with it); ShareBasis {ActuatorForce, DriverTorque}; WeightBreakdownBuilder fed per sample by compute_sweep_data_with_weights; required_totals. AppState::compute_sweep passes gravity_breakdown::weight_sources(blueprint); plain compute_sweep_data = no breakdown)

  other_top_level_gui:
    - mod.rs (LinkageApp + update loop orchestration; handle_delete_shortcut; draw_place_mass_field)
    - menu_bar.rs (File/Edit/Help/View/Image menus + sample gallery)
    - theme.rs (CAD dark visuals, Nathan Mode grayscale)
    - input_panel.rs
    - plot_panel/ (split module)
    - parametric_panel.rs
    - force_toolbar.rs
    - error_panel.rs
    - tutorial.rs
    - undo.rs
    - dxf_import.rs
    - test_support.rs (#[cfg(test)] helpers shared by GUI module tests, e.g. sorted_link_ids, set_actuator_stored_force, input events primary_button, primary_button_with, key_press, typed, the headless frame central_panel_frame, painted-output inspection drawn_texts, drew_text, text_rect, drawn_line_colors; the robot-lift fixture swept_lift with sample_at and pose_at; extend it instead of re-implementing fixtures per module)

entry_points:
  native_bin: src/bin/linkage_gui.rs (uses native feature)
  wasm_bin: src/bin/linkage_web.rs (WASM build)
  library: src/lib.rs

feature_flags:
  default: [native]
  native: [rfd, resvg, gif, open, dirs]

where_things_belong:
  add_new_force_element:
    - src/forces/elements/element_types.rs (add struct)
    - src/forces/elements/evaluation.rs (add evaluate_ fn)
    - src/forces/elements/force_element.rs (add enum variant + dispatch)
    - src/gui/canvas/rendering/force_render.rs (add visualization arm)
    - src/gui/property_panel/force_editor.rs (add editor UI)

  add_new_plot_tab:
    - src/gui/plot_panel/mod.rs (add to PlotTab enum, dispatcher, tab button)
    - src/gui/plot_panel/{mechanics,dynamics,actuator,coupler,weights}.rs (add draw_ fn)
    - src/gui/sweep/mod.rs (compute + store data in SweepData)

  add_new_interactive_tool:
    - src/gui/state/types.rs (add EditorTool variant)
    - src/gui/canvas/interaction.rs (add handler)
    - src/gui/mod.rs (add toolbar button) or src/gui/menu_bar.rs (add menu item)

  add_new_sample_mechanism:
    - src/gui/samples/{fourbar,sixbar,special}.rs (add builder fn)
    - src/gui/samples/mod.rs (add SampleMechanism variant + all() + name/description/category)
