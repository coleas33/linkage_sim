  manual_size_gui: "src/gui/size_controls.rs (controls_ui, the direct size/count/gap sliders and a local Minimum OD range preference); panel.rs CentreView::SizeAndTorque replaces the inputs side with these controls and a closed Detailed inputs section, keeps live engine torque and geometry in the centre and all dashboard checks, and joins edits to existing history; since slice 1 it is the first view and the solver's home: the Required torque slider (metal.required_min_Nm), Hot-low torque and its gap (torque_gap_text), the Outside diameter and Overall length hovers (DIAMETER_HOVER, LENGTH_HOVER), pullout_label, the Auto toggle (AUTO, AUTO_SUFFIX, variable_slider, change_text, SET_BY_AUTO: the matching slider disabled) and the consequence lines under each control (Consequences, one ConsequenceCache held by the panel); since slice 2 a hint line (plain_text::HINTS) under each control, above its consequence lines"
