layout:
  root: linkage-sim-rs/
  source: src/
  tests: tests/
  data: data/ (golden fixtures)
  docs: ../docs/

reference:
  path: reference/ (repo root, outside linkage-sim-rs/; upstream code kept verbatim as test oracles, see reference/README.md)
  magcoupling_py:
    path: reference/magcoupling-py/
    role: vendored magcoupling 1.0.0 (Python port of magnetic_coupling_torque_calculator.xlsx); read-only oracle for the magcoupling M1 audit and the Rust port magcoupling-rs (M2)
    engine: magcoupling/ (READ-ONLY, never edit; parity and differential tests compare against it unchanged)
    parity_suite: tests/ (test_parity.py checks every workbook formula cell against reference_values.json; test_api.py; test_optional.py needs the magpylib and matplotlib extras)
    tools: tools/extract_reference.py (regenerates tests/reference_values.json from the workbook); tools/gen_differential.py (writes magcoupling-rs/tests/data/python_schema.json, static_data.json and differential/*.json (one file per result group, plus full.json, the run that varies all inputs at once) from the engine, with slider ranges read from magcoupling-rs/tests/data/input_schema.json, leaving out every row whose rust_only flag is true so a Rust-only input keeps its Rust default in every case; --check verifies they are current)
    venv: .venv/ (gitignored; created from requirements-audit.txt, see running below)
  audit:
    path: reference/magcoupling-py/audit/
    references: audit/references/ (independent reference models per formula family - 2D field, slab field, block geometry, metal stack, remanence, slip and thermal, sweeps, clamps, units)
    tests: audit/tests/ (every check carries @pytest.mark.family; conftest.py enforces the marker on audit items only, so it can share a session with tests/; *_reference_sanity.py files self-test the references; test_harness_smoke.py covers the harness and the conftest rule)
    tools: audit/tools/ (group_candidates.py groups failures by root cause, coverage_table.py prints the confirmed-correct table, placeholder_sensitivity.py prints placeholder sensitivities)
    out: audit/out/ (generated results.json, candidate_groups.json, coverage.md and more; gitignored, regenerate by running the suite)
    report: docs/analyses/2026-09-29-magcoupling-math-audit.md (findings E1..E14, M1..M15, P1..P3) and docs/analyses/2026-09-29-magcoupling-audit-results.json (raw results with skeptic verdicts)
    plan: docs/superpowers/plans/2026-09-29-magcoupling-m1-math-verification.md
    expected_result: 46 failing checks (32 root-cause groups, all classified in the report) among 790 checks; the failures document engine or workbook errors, they are not regressions
  running:
    setup: "cd reference/magcoupling-py; python -m venv .venv; ./.venv/Scripts/python -m pip install -e . -r requirements-audit.txt (Windows layout; use .venv/bin/python on POSIX)"
    parity_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests"
    audit_suite: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q audit/tests -p no:cacheprovider (writes audit/out/results.json)"
    both_in_one_session: "cd reference/magcoupling-py; ./.venv/Scripts/python -m pytest -q tests audit/tests -p no:cacheprovider"
    audit_tools: "cd reference/magcoupling-py; ./.venv/Scripts/python -m audit.tools.group_candidates | coverage_table | placeholder_sensitivity (run after the audit suite; set PYTHONIOENCODING=utf-8 on Windows for coverage_table)"

magcoupling_rs:
  path: magcoupling-rs/ (repo root, sibling of linkage-sim-rs/; separate crate, NOT a workspace member)
  role: Rust port of reference/magcoupling-py (spec docs/superpowers/specs/2026-09-28-magcoupling-calculator-design.md); M2 complete - every Python module except fields3d (M3) is ported, workbook parity covers all 1,149 checks, E1-E14 applied; Addendum A-1 (grades, materials, E15-E20), A-2 (harmonic set, assumptions, inverse sizing, space claim) and A-3 (equation explorer engine side - evaluable records, drift guard, A3 traceability, A4 notes) complete; M4 infrastructure adds the egui panel, the standalone app binaries and the /magcoupling/ web bundle; M4-1 adds the inputs, dashboard, results table, session (undo/redo, design files, share links), sizing mode and theme; M4-2 adds the geometry view, five plots (egui_plot) and the clamp drawing and table; M4-3 adds the equation explorer (typesetter, hover, Equation panel), the assumptions view and banner, the teaching notes and diagrams, the material, part and grade pickers and the material warnings
  guide: magcoupling-rs/README.md (tests, regenerating data, porting a module, Python-to-Rust translation rules, applying deviations)
  lib: magcoupling (src/lib.rs re-exports compute_all, headline, DesignInputs, DesignResults; mod gui behind feature gui, mod app behind feature app)
  engine: src/engine/ (pure std, wasm32-clean; one module per Python module)
  engine_files:
    meta: meta.rs (inputs!/results!/rows! macros, param/out and col/at_row/uncelled_col builders, slider range, assumption flag, Value, InputSet get/set/visit and ResultSet get/visit by dotted path (a table row's field as table[i].field), validate (the set() checks on a whole input struct); table rows via RowSet and TableLayout with synthesized cells, results! tables section)
    compat: compat.rs (py_min/py_max, ceiling/floor_, text0, py_repr, fmt_num, fmt_fixed, parity_close)
    deviations: deviations.rs (REGISTRY of the M1 corrections E1-E14 and the Addendum A corrections E15-E20 (report docs/analyses/2026-09-30-magcoupling-addendum-a-verification.md, section 8 decisions via Approval::Addendum); depends_on (E15-E17 on E9); Deviations switch; registry Probe entries and changes_file golden-file names; NONE/only()/with()/without() and restore_workbook_defaults behind the test-only workbook-parity feature)
    constants: constants.rs (MU0 = 1.256637e-06, the workbook's rounded value; NDFEB_DENSITY_G_MM3)
    library: "library.rs (Magnet library rows = the A6 part table: workbook values, grade, vendor page, coating, magnetization; the exact-text lookup; br_T applies E3 with grades::N42SH.br_T; tmax_C and grade_id apply E19, the vendor grid of the SuperMagnetMan arcs)"
    warnings: "warnings.rs (Addendum A5 material warnings: WARNING_RULES, six rules with text, Severity and note id; thresholds SLEEVE_SIGMA_BASELINE_S_M 1.35e6, LOW_SATURATION_T 1.7, CTE_MISMATCH_LIMIT_PER_C 15e-6; WarningResults = DesignResults::warnings, Rust-only)"
    material_library: "material_library.rs (Addendum A5 materials library MATERIALS, 14 entries cited per value; EngineProps = workbook numbers where they exist (decisions 21-26), else sourced; BACK_IRON_CHOICES, SLEEVE_LINER_CHOICES, CAP_HOUSING_CHOICES, code 1 = the workbook's material; resolve -> PartProperties: the circuit in effect, the design flux density, the steel, body (no back iron), sleeve and cap values the engine reads)"
    grades: grades.rs (Addendum A6 grade table GRADES, 17 grades cited per value from docs/analyses/2026-09-30-magcoupling-addendum-a-data.json; grade(id); N42SH keeps the workbook Hcj 1592 and beta -0.005)
    calibration: "calibration.rs (Calibration sheet, 23 result cells, 16 default inputs; compute takes the Calculator's harmonic set; Rust-only tau7_Pa-tau11_Pa and end_effect_check)"
    assumptions: "assumptions.rs (Addendum A3 panel: ASSUMPTIONS, 14 rows over the 15 inputs flagged .assumption() with rationale and source; states, modified, any_modified, reset_to_workbook_defaults; the dependency-graph traceability test is plan A-3's)"
    sizing: "sizing.rs (Addendum A1 inverse sizing: FreeVariable (axial length, magnets per ring, ring radius), SCAN_CELLS 64, VALUE_TOLERANCE_MM 1e-9, is_valid (decision A2-4), solve -> Solved / NotReachable {best}: the scan refined at the first crossing, each peak and each validity edge; SizingError; the search's unit tests drive it with plain functions)"
    housing: "housing.rs (Addendum A1 housing: axial_housing, the hub length, cup cavity depth and retainer span in effect, which follow the length override, decision A2-8; the space claim: HousingResults = DesignResults::housing, Rust-only overshoot per axis, space_claim_check and the three dimensions in effect; the autofit classes of report 6.5 in its module doc)"
    model: "model.rs (Calculator sheet: inputs (Rust-only grade_inner/grade_outer: a grade for manual dimensions, Addendum A6; max_harmonic, the A3 harmonic set, MAX_HARMONIC_CHOICES, harmonic_count; axial_length_mm, the A1 length override), ModelResults 73 result cells (Rust-only inner_grade/outer_grade, tau7_Pa-tau11_Pa, end_effect_check, each ring's alpha and magnet density), HARMONICS [1, 3, 5] (the workbook set) and ODD_HARMONICS [1..11], peak_off_half_pitch (one root search for any odd set, decision 29), peak_angle (the one E7 gate), tau_at and at_pull_out (E7), harmonic_sum/harmonic_slot, end_effect_in_range/end_effect_check (audit M9 flag), pitch_share and blocks_fit (the A2-4 fit rule: flats, or arcs that do not overlap), ResolvedMagnet::alpha_br/density_g_mm3 (grade mode, decision A2-7), corner_radius and br_factor (shared across sheets); mass_estimate and MassResults, 6 result cells)"
    metal_design: "metal_design.rs (Metal design sheet: MetalDesignInputs 48 fields; retainers, 9 result cells; compute, MetalDesignResults 49 result cells; VALIDATION_ITEMS)"
    materials: "materials.rs (Materials sheet: inputs, plus the Rust-only part selectors materials.parts (back_iron, sleeve_liner, cap_housing); AL7075 and AL6061 alloys; ScrewClasses::proof, NaN for a code outside 1-3; compute, MaterialsResults 7 result cells plus the Rust-only cup_wall_suggested_mm, the A1 autofit's wall, decision 27)"
    temperature: "temperature.rs (Temperature design sheet: 7 input groups, 37 cells; ADHESIVES table and selected_adhesive, NO_ADHESIVE (NaN, \"#N/A\") for a code outside 1-4; TemperatureLinks; compute, TemperatureResults 130 result cells and the uncelled adhesive name; demag_onset_C, cold_onset_C (E20, positive beta), ring_demag (E20: each ring's check, the weaker governs, A13), volkersen_peak_shear_MPa; Rust-only coercivity_source and the free-space fields of E17; Rust-only demag results hcj20_used/beta_used, demag_ring, cold_ring and the cold side)"
    clamps: "clamps.rs (Shaft clamps and Clamp screw sizes sheets: 25 input cells; SCREW_SIZES, TABLE_COLUMNS, MACHINING_STEPS; ScrewRow with 34 fields and 165 table cells; screw_class_name, \"#N/A\" for a code outside 1-3; compute, ClampResults 33 result cells plus the Rust-only length_note; the screw table lists after the scalars)"
    sweeps: "sweeps.rs (Gap sweep and Pole sweep sheets: GAP_SWEEP_CORNER_GAPS_MM, POLE_SWEEP_POLES; SweepRow with 26 fields, 338 and 156 table cells; SweepContext with 20 fields (Python's 19 plus bond_inner, read only by E4); gap_sweep, pole_sweep)"
    api: api.rs (DesignInputs/DesignResults groups in Python order, the complete Python DesignResults; compute resolves the part materials first (material_library::resolve) and feeds the values in effect; compute_all applies Deviations::ALL; headline and HEADLINE (the 15 dashboard numbers, Python order, read with ResultSet::get, about 0.4 us per call in release); DesignInputs::validate; test-only compute_all_with, DesignInputs::defaults_with)
    ported: [meta.rs, compat.rs, constants.rs, calibration.rs, library.rs, grades.rs, material_library.rs, warnings.rs, model.rs, metal_design.rs, materials.rs, temperature.rs, clamps.rs, sweeps.rs, api.rs]
    explain: "explain/ (Addendum A2-A4 equation explorer, engine side, plan A-3: markup.rs formula and symbol grammar, parser and tree (inf, nan, ceilto, floorto, fmt, fmtnum, concat); eval.rs evaluator with Trace (value and condition terms, arms taken); tables.rs static tables a formula reads; record.rs Record/Family/Eval and records/ (torque, demagnetization, slip_heating, temperature, clamps, dashboard, geometry; #[rustfmt::skip] data); registry.rs Registry::build, equation_for, used_by, graph, upstream, downstream, upstream_inputs, term_rows, family_members, term_style, modified_assumptions_upstream, choices, corrections_upstream; symbols.rs SYMBOLS; scope.rs SCOPE (decision 31 plus the G1 geometry callouts, 169 paths, all explained); notes.rs NOTES (17 A4 notes, START_HERE, Review gate, note_for); render.rs plain text)"
    addendum_only: [assumptions.rs, sizing.rs, housing.rs, explain/]
    remaining: [fields3d (M3)]
  features:
    gui: "src/gui/ (egui 0.32, egui_plot 0.33, serde_json, base64, flate2, log, rust_xlsxwriter 0.99.1 (its wasm feature and js-sys on wasm32); no eframe, no I/O): typeset.rs (the equation typesetter: layout, layout_equation, layout_symbol -> Laid of Ink; TermColors (of, with_members, with_marked), TERM_PALETTE; glyph_safe; equation_ui, laid_ui, term_at), readouts.rs (registry (OnceLock, built once), Readouts (show, show_over, mark, open_note, finish -> ReadoutEvents), OPEN_HINT, MARK_WIDTH, REGISTRY_LOG_PREFIX), explorer.rs (Explorer: open, trail, hovered, focus, explain, start_here, note; open_path, drill, back_to, follow, focus_input, take_scroll, close (clears the focus), open_note, start, stop, marks, end_frame; explorer_ui, note_ui, term_tag, term_label, plain_symbol, reviewed_note (every note shown by id); EQUATION_PANEL, panel_heights (the panel's drag range and starting height: PANEL_SHARE 0.45 of the centre region, MIN_PANEL_HEIGHT 120, its top edge stopping VIEW_STRIP 160 below the region's top), MAX_TRAIL, SHOWN_CRUMBS, ELIDED, FOCUS_WIDTH, SWATCH_DIM), diagrams.rs (diagram_shapes, diagram_ui, DIAGRAM_SIZE: the six notes::Diagram kinds), pickers.rs (MATERIAL_PICKERS, PART_PATHS, GRADE_PATHS, picker_ui, choice_hover, material_of, material_summary, material_properties, part_label, part_properties, grade_label, grade_properties), panel.rs (MagcouplingPanel: header with Undo/Redo/Reset all/Save design/Load design/Copy share link/Export spreadsheet, inputs SidePanel, dashboard SidePanel, CentreView (Geometry, the default; Plot(PlotKind) x5; Clamp; Results) under the end-effect banner, the tab row and banner then the view each in a child ui confined (max rect and clip rect) to the space above the Equation panel (confined), so no view paints into the panel or takes a click inside it; fn ui(&mut self, ui) recomputing compute_all of the shown design every frame; PanelRequest (SaveFile with the file's bytes, OpenDesign) drained by take_requests; export_spreadsheet (both spreadsheet buttons: the header's and the results table's Export XLSX); assumptions_banner; load_design_file, load_share_payload, open_design, open_share_payload (the session's start: no undo step), set_share_base, set_keyboard_shortcuts, report; undo/redo shortcuts; sizing controls and run_sizing), inputs.rs (InputCatalogue::get with groups (the workbook order) and workflow, groups_in(InputOrder), section_of(InputOrder, path); InputGroup::plain_sections, advanced_sections and has_advanced, InputSection::heading_in (how the inputs side, the filter's runs and the spreadsheet order and head a group's sections); InputOrder (Workflow, the default; Workbook), WORKFLOW (8 groups of WorkflowSection, the requirements first, advanced sections last), ADVANCED_HEADING, filter_inputs -> SectionMatches (InputEntry's haystack, built once), FILTER_HINT, KEY_DESIGN, SECTION_LABELS, OPTIONAL_SEEDS, step_decimals, outside_range, text_hint, input_tooltip), input_ui.rs (input_row (a locked row keeps its label live, to trace) -> RowOutput {edit, widget, label_clicked}, slider, RowEdit, TRACE_HINT), dashboard.rs (DASHBOARD, Level (ordered by severity), CHECKS (30 design checks), verdict_level, check_level, failing_checks, badge, END_EFFECT_ROWS, greyed_by_end_effect (out of range: no badge on a greyed check, the table's and its failing filter's included), STORED_3D_ROWS, result_info, result_tooltip (the hover hook), hover_text, dashboard_lines, end_effect_banner), geometry.rs (geometry -> Geometry {end, side: View {pieces, dashed, callouts, min, max}, notes}; Part, Outline, Callout with tag/path/level, Note; MAX_DRAWN_POLES 200; CLAIM_REACH 10 (a claim line farther than 10 x the pieces' extent is left off with a note); DESIGN_CHECK, AUTOFIT, NOT_DRAWN, mm, finite), geometry_view.rs (geometry_ui -> GeometryLayout (the drawing keeps 160 points while the callout list keeps three rows, then shrinks to scale; the list scrolls in the rest); Transform; side_by_side (views at one scale, None without room); arrowhead; plated_text (a text on a plate, shared with the clamp drawing); part_color; DIMENSION), plots.rs (PlotKind with id() from the *_ID consts, torque_at_temperature, torque_temperature, sweep_points, slip_heating, torque_at_angle, torque_angle, plot_ui; legend names; NOTHING_TO_PLOT, EMPTY_TEMPERATURE_AXIS, rows_not_plotted), clamp_drawing.rs (clamp_drawing -> ClampDrawing of Mark {Circle, Area, CentreLine, Dimension, Note} per view, NO_SCREW_FITS, fmt_g, clip_to_disc, drawing_ui, clamp_ui, SUMMARY, screw_rows), corrections.rs (CorrectionIndex::get, GOLDEN_FILES, marker_text, marker_tooltip), results_table.rs (table_entries (TableEntry.check), entry_index, search, ResultOrder (Grouped, the default; Engine), Line, table_lines, exact_number, results_csv, results_json, ResultsTable (is_open, opens_by_default, ui with the trace; group headings with the worst check level, ignored while searching), FAILING_ONLY, TRACED_ONLY, NOTHING_FAILS, NOTHING_TRACED, NO_RESULT, empty_text, CLEAR_TO_CLOSE, row_tooltip, column_widths, entry_level (a row's badge) and worst_level (a group heading's: the worst of its rows'), RUST_ONLY, TableAction (ExportCsv, ExportJson, ExportXlsx), EXPORT_XLSX), result_groups.rs (result_groups -> ResultGroup {id, label, other, rows}: the headline, CHAIN_LABELS (the scope's six chains, adhesive, mass), CHAIN_PREFIXES, PACKAGE_LABELS; row_template, package_of, groups_of), trace.rs (Trace::of -> {source, kind: TraceKind, paths}, marks, count_in, banner (at the foot of the inputs side); TRACING, CLEAR_TRACE), session.rs (Design, design_to_json/design_from_json, encode/decode_share_payload, share_link, LoadError, PATH_MIGRATIONS, json_number), history.rs (History, MAX_UNDO_LEVELS 100), spreadsheet.rs (the spreadsheet export's layout, decisions X-1 to X-12: sheets(&Snapshot) -> Summary, Inputs (in the order shown), Results (by physics chain), Assumptions, each a Sheet (frozen_rows, autofilter) of rows of Cell {CellValue (Empty, Number, Text, Time), CellStyle (Plain, Title, Header, Group, Section, Level)}; value_cell, level_cell; the Inputs ordered and headed by the page's own InputGroup::plain_sections/advanced_sections and InputSection::heading_in, the Results by results_table::table_lines and entry_level; INPUT_COLUMNS, RESULT_COLUMNS, DASHBOARD_COLUMNS, ASSUMPTION_COLUMNS), xlsx.rs (spreadsheet_bytes, xlsx_bytes (rust_xlsxwriter: number cells, frozen headers and autofilters where the sheet asks, widths, bold headings, GROUP_FILL on the group headings, level fills), cell_text (cut at MAX_CELL_CHARS 32,767 UTF-16 code units, as Excel counts, at a whole character), fill (the standalone page's badge colours, a fixed dark-theme palette), now_unix_s (js_sys::Date on wasm32), XLSX_FILE_NAME magcoupling-results.xlsx, XLSX_MIME), sizing.rs (SizingMode, SizingState, variable_key/label, SizingRunner (update, solve_now), DEBOUNCE_S 0.25), format.rs (format_value, with_unit, non_finite_text, search_haystack, search_needle), test_support.rs (cfg(test): sized_frame(_at), region_frame (a view in a child ui of a given max rect, unclipped, returning the rect it used), SCREEN, key_event, key_tap, select_all, primary_button, flat_shapes, drawn_texts, text_rect, text_rects, text_color, assert_glyphs, short_magnets, read_xlsx (calamine, a dev-dependency), xlsx_part (zip), snapshot (the spreadsheet tests' Snapshot of a design in the workflow order))"
    app: "src/app.rs (MagcouplingApp::new applies the theme; ui drains the panel's requests; open_share_payload logs SHARE_LINK_LOADED, a picked design file DESIGN_FILE_LOADED; run_native shared by both bins; TITLE; CANVAS_ID = magcoupling_canvas), src/app/theme.rs (cad_dark_visuals, a copy of linkage-sim-rs's checked body for body; apply forces ThemePreference::Dark), src/app/files.rs (save of a request's bytes: rfd dialog natively (write_file), Blob download on the web; DesignPicker: rfd pick, async on the web); bins src/bin/magcoupling_app.rs (magcoupling-app, native) and src/bin/magcoupling_web.rs (magcoupling-web, wasm32 eframe WebRunner via wasm-bindgen start; reads ?m= and sets the share base to the page's address; native fallback = run_native), both required-features app"
    workbook_parity: "test-only, enabled by a self dev-dependency; never in a shipped build (linkage-sim-rs/scripts/magcoupling_shipped.sh, gate 10)"
    versions: "Cargo.toml caret ranges (egui 0.32, egui_plot 0.33, eframe 0.32, wasm-bindgen 0.2); Cargo.lock pins linkage-sim-rs/Cargo.lock's egui/eframe 0.32.3, egui_plot 0.33.0 and wasm-bindgen 0.2.114 (= the deploy-web.yml wasm-bindgen-cli pin); gate 11 checks"
  web_bundle: "linkage-sim-rs/web/magcoupling/ (index.html committed, canvas magcoupling_canvas, absolute /magcoupling/ glue path; magcoupling-web.js and magcoupling-web_bg.wasm gitignored in web/.gitignore), built by linkage-sim-rs/scripts/build_magcoupling_web.sh (called by build_web.sh, which deploy-web.yml runs), served by serve_web.sh [PORT] at /magcoupling/; vercel.json revalidates /magcoupling/magcoupling-web.js"
  shipped_builds: "linkage-sim-rs/scripts/magcoupling_shipped.sh (sourced by build_web.sh, build_magcoupling_web.sh and gate.sh): MAGCOUPLING_WEB_ARGS, MAGCOUPLING_NATIVE_ARGS, LINKAGE_WEB_ARGS, LINKAGE_NATIVE_ARGS (the linkage app's builds carry the panel), magcoupling_assert_shipped (reads cargo --message-format=json; fails unless the shipped bin was compiled and no magcoupling-rs unit has workbook-parity)"
  tests: tests/ (the integration tests parity.rs, differential.rs, python_schema.rs, schema.rs, deviations.rs, static_data.rs, robustness.rs, grades.rs, material_library.rs, material_links.rs, assumptions.rs, sizing.rs, explain.rs (the drift guard, the registry, the scope, the A3 traceability and the A4 note links); common/mod.rs holds the shared differential Case loader and the PORTED_INPUTS / PORTED_RESULTS ratchets)
  test_data: tests/data/ (reference_values.json = copy of the vendored snapshot; input_schema.json via MAGCOUPLING_BLESS=1 cargo test --test schema; python_schema.json, static_data.json, differential/<group>.json (10 result groups plus helpers.json) and differential/full.json via tools/gen_differential.py; deviations/E3.json, E4.json and E5.json, the golden files of the broad corrections, via MAGCOUPLING_BLESS=1 cargo test --test deviations each_deviation_alone_changes_exactly_its_registered_cells)
  gate: "linkage-sim-rs/scripts/gate.sh gates 4-12: 4-6 the engine (test, clippy -D warnings, wasm32 check); 7 cargo test --features app (panel and app headless tests, bins built with workbook-parity unified); 8 clippy --all-targets --features app -D warnings; 9 wasm32 clippy -D warnings (gui lib, magcoupling-web); 10 workbook-parity guard (native and wasm32 shipped builds of the calculator's app and of the linkage app, a negative control per shipped build); 11 lock parity (egui, egui_plot, eframe, rust_xlsxwriter, wasm-bindgen; deploy-web.yml CLI pin); 12 Python parity suite + gen_differential.py --check; --full adds 13, build_web.sh (both bundles)"

modules:
  core:
    bodies: src/core/body.rs
    constraint: src/core/constraint/ (mod.rs + revolute, prismatic, fixed, cam, trait_def)
    driver: src/core/driver.rs
    linear_driver: src/core/linear_driver.rs
    mechanism: src/core/mechanism.rs
    state: src/core/state.rs

  forces:
    elements: src/forces/elements/ (element_types.rs, evaluation.rs, force_element.rs, time_modulation.rs, mod.rs)
    helpers: src/forces/helpers.rs
    compound: src/forces/compound.rs

  solver:
    assembly: src/solver/assembly.rs
    kinematics: src/solver/kinematics.rs
    statics: src/solver/statics.rs
    inverse_dynamics: src/solver/inverse_dynamics.rs
    forward_dynamics: src/solver/forward_dynamics.rs
    events: src/solver/events.rs
    condition: src/solver/condition.rs

  analysis:
    path: src/analysis/
    files: [validation, grashof, transmission, coupler, energy, envelopes, motor_sizing, virtual_work, crank_selection, force_breakdown, gravity_breakdown]
    notes:
      gravity_breakdown: per-weight gravity power P_g,i = m_i g.v_i (weight_sources from the blueprint = link self-weights + applied point masses; gravity_powers; gravity_vector; classify / force_share / is_braking with EPS_REL_LDOT, NEUTRAL_REL, BRAKE_TOL_REL; display names display_name, name_with_id, point_mass_title shared by the plot legend, the property panel and the canvas). Pure, no GUI deps.

  io:
    path: src/io/
    files: [schema, serialization, to_json]

  geometry:
    path: src/geometry/
    responsibility: low-level 2D geometry helpers (polygon clipping, body_rect_to_world, centroid); a body's shape (rectangle or circle, core::body::GeometryShape) and its world outline and contact point are BodyGeometry methods (outline_world, centre_world, extreme_point_world)

  gui:
    path: src/gui/

gui_submodules:
  canvas:
    path: src/gui/canvas/
    files:
      mod: canvas/mod.rs (top-level canvas orchestration)
      interaction: canvas/interaction.rs (drag, pan, zoom, tool handlers; weight hover/drag - weights_interactive, handle_weight_drag, weight_drop_target)
      rendering:
        mod: canvas/rendering/mod.rs (main render pass, overlays, tooltips, grid, background image)
        primitives: canvas/rendering/primitives.rs (springs, dampers, arrows - draw_arrowhead is the one straight-arrow head, draw_arrow = shaft + head; arcs, markers, alignment guides)
        force_render: canvas/rendering/force_render.rs (force element visualization + load-path heat map; actuator label text actuator_label_text / format_actuator_label, with the required force from AppState::actuator_label_force and motoring/braking from AppState::actuator_label_power; format_magnitude)
        weights: canvas/rendering/weights.rs (payload weights on the canvas - draw_weights draws markers + gravity arrows coloured by classification at AppState::current_sweep_index; show_weight_tooltip and the selected-weight card show weight_readout_lines; weight_at_pose, weight_arrow_length_px, gravity_screen_dir; place_mass_hint)
      hit_testing: canvas/hit_testing.rs (body-segment projection; weight picking find_point_mass_at + point_mass_screen_pos, which drawing shares)
      colors: canvas/colors.rs (includes classification_color, re-exported as canvas::classification_color — the one helping/hurting/neutral palette for weight arrows and Weight Breakdown lines)
      context_menu: canvas/context_menu.rs
      alignment: canvas/alignment.rs

  state:
    path: src/gui/state/
    files: [mod, blueprint_ops, driver_ops, entity_crud, file_io, grid, load_cases, parametric, simulation, solver_helpers, templates, types, undo_ops, view_transform, display_units, tests]

  property_panel:
    path: src/gui/property_panel/
    files: [mod, diagnostics, force_editor, health, pending_edits, undo_panel, weight_editor]
    notes:
      weight_editor: selected-weight editor (draw_selected_weight) and the link editor's Weights section with Add weight (draw_link_weights); shared fields draw_weight_fields; committed_number (commit once per edit); weight_mass_drag_value (also the + Mass toolbar field)

  plot_panel:
    path: src/gui/plot_panel/
    files:
      mod: plot_panel/mod.rs (PlotTab enum incl. WeightBreakdown, dispatcher, shared helpers incl. sweep_x_to_display - the one sweep-x to display-x conversion; Weight Breakdown force/power toggle bound to AppState::weight_breakdown_show_power)
      mechanics: plot_panel/mechanics.rs (body angles, transmission, MA, joint reactions)
      dynamics: plot_panel/dynamics.rs (driver torque, inverse dynamics, energy)
      actuator: plot_panel/actuator.rs (force, speed, power; force plot draws every finite sample — no outlier filter, BL-010; force and power plots shade braking bands via weights::draw_braking_bands)
      weights: plot_panel/weights.rs (payload weights - Weight Breakdown tab draw_weight_breakdown, one line per weight source + Other loads + Total, force or power share, runs coloured per sample by classification; braking bands braking_bands / band_y_extent / draw_braking_bands; pure assembly breakdown_lines, source_line_name, breakdown_y_label)
      coupler: plot_panel/coupler.rs (trace, velocity, acceleration, output force)

  samples:
    path: src/gui/samples/
    files: [mod, fourbar, sixbar, special, helpers, custom_6bar.json]

  export:
    path: src/gui/export/
    files: [mod, svg, dxf, csv, raster, report, schematic, firmware, animation, animation_template.html]
    notes:
      schematic: Auto-generated labeled mechanism schematic (SVG) — File → "Export labeled schematic (SVG)..."; matches docs/superpowers/specs/2026-04-29-linkage-equations-reference.md figures 2 & 3.
      animation: File → "Export Animation (HTML)..." — AnimationData (one Frame per solved sweep sample, mm and N) embedded as JSON in animation_template.html (an SVG player, no network); generate_animation_html, animation_export_available.

  sweep:
    path: src/gui/sweep/
    files:
      mod: sweep/mod.rs (SweepData + SweepData::index_at_driver (nearest sample to the current driver angle/stroke, circular in angle mode — BL-010), compute_sweep_data, solve_sweep_positions two-pass Newton continuation for full-revolution sweeps — post-gap samples reached backward from 360 deg on the starting branch (BL-011), push_nan_row helper)
      motion_profile: sweep/motion_profile.rs (trapezoidal velocity profile, apply_motion_profile; SCurve falls back to ConstantSpeed in driver-side mode)
      fourbar: sweep/fourbar.rs (4-bar linkage detection for transmission angle)
      weights: sweep/weights.rs (payload weights - WeightBreakdown {sources, basis, gravity_power, force_share, power_share, other_force, other_power, total_force, total_power, braking} + classification() and classifications() (per-sample class of one source, band computed once; the plot colours lines with it); ShareBasis {ActuatorForce, DriverTorque}; WeightBreakdownBuilder fed per sample by compute_sweep_data_with_weights; required_totals. AppState::compute_sweep passes gravity_breakdown::weight_sources(blueprint); plain compute_sweep_data = no breakdown)

  other_top_level_gui:
    - mod.rs (LinkageApp + update loop orchestration; window_title, send_title (BL-037); handle_keyboard_shortcuts; handle_delete_shortcut; draw_place_mass_field)
    - menu_bar.rs (File/Edit/Help/View/Image/Tools menus + sample gallery; hands the calculator window the menu bar's bottom)
    - "calculator_window.rs (Tools -> Magnetic coupling, M5: CalculatorWindow holds the magcoupling panel, created on the first opening and kept; show draws the egui::Window (kept whole below the menu bar, whose bottom draw_menu_bar hands set_menu_bar_bottom, its contents capped at that area less window_chrome; skipped on a screen without room for its frame and title bar), moves the keyboard by the last press (the window's layer and its resize band give it, a popup layer (Foreground, Tooltip, Debug) leaves it, anything else takes it), removes the key events but egui's zoom keys (UI_ZOOM_KEYS) while it has it and does the panel's requests (export::download's download_bytes, with an Excel workbook filter for the .xlsx spreadsheet; DesignPicker over rfd); TITLE, TOOL_PARAM, TOOL_MAGCOUPLING, magcoupling_share_base)"
    - theme.rs (CAD dark visuals, Nathan Mode grayscale)
    - input_panel.rs
    - plot_panel/ (split module)
    - parametric_panel.rs
    - force_toolbar.rs
    - error_panel.rs
    - tutorial.rs
    - undo.rs
    - dxf_import.rs
    - test_support.rs (#[cfg(test)] helpers shared by GUI module tests, e.g. sorted_link_ids, set_actuator_stored_force, input events primary_button, primary_button_with, key_press, key_tap, typed, click_events, drag_events, the headless screen NATIVE_SCREEN and screen_input, the headless frame central_panel_frame, painted-output inspection drawn_texts, drew_text, text_rect, text_clip_rect, drawn_line_colors; the robot-lift fixture swept_lift with sample_at and pose_at; the magnetic coupling calculator's design fixture magcoupling_gap_design; extend it instead of re-implementing fixtures per module)

entry_points:
  native_bin: src/bin/linkage_gui.rs (uses native feature)
  wasm_bin: "src/bin/linkage_web.rs (WASM build; ?m= opens a shared mechanism, ?tool=magcoupling opens Tools -> Magnetic coupling)"
  library: src/lib.rs
  web_scripts: "scripts/build_web.sh (linkage bundle through the workbook-parity guard, then build_magcoupling_web.sh; deploy-web.yml runs it), scripts/build_magcoupling_web.sh (web/magcoupling/), scripts/serve_web.sh [PORT] (both bundles; default 8080), scripts/magcoupling_shipped.sh (sourced: shipped magcoupling-rs cargo args and the workbook-parity guard)"

feature_flags:
  default: [native]
  native: [rfd, resvg, gif, open, dirs]

where_things_belong:
  add_new_force_element:
    - src/forces/elements/element_types.rs (add struct)
    - src/forces/elements/evaluation.rs (add evaluate_ fn)
    - src/forces/elements/force_element.rs (add enum variant + dispatch)
    - src/gui/canvas/rendering/force_render.rs (add visualization arm)
    - src/gui/property_panel/force_editor.rs (add editor UI)

  add_new_plot_tab:
    - src/gui/plot_panel/mod.rs (add to PlotTab enum, dispatcher, tab button)
    - src/gui/plot_panel/{mechanics,dynamics,actuator,coupler,weights}.rs (add draw_ fn)
    - src/gui/sweep/mod.rs (compute + store data in SweepData)

  add_new_interactive_tool:
    - src/gui/state/types.rs (add EditorTool variant)
    - src/gui/canvas/interaction.rs (add handler)
    - src/gui/mod.rs (add toolbar button) or src/gui/menu_bar.rs (add menu item)

  add_new_sample_mechanism:
    - src/gui/samples/{fourbar,sixbar,special}.rs (add builder fn)
    - src/gui/samples/mod.rs (add SampleMechanism variant + all() + name/description/category)
